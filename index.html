<!DOCTYPE html>
<html lang="en">
<head>

<title>MealTrend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#E7EBE4;--surface:#FCFCFA;--ink:#13170F;--soft:#5D6656;--rule:#C9D0C2;--sambal:#AF3324;--turmeric:#B87C12;--pandan:#3B6B45;--deep:#1F4D46;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:10px}
  header h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
  header .v{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--soft);margin-left:auto}
  #badge{background:var(--sambal);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 6px;border-radius:9px;display:none}
  #view{padding:16px 16px 90px;max-width:720px;margin:0 auto}
  #tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--rule);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
  #tabs a{flex:1;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);text-decoration:none;padding:8px 2px;border-radius:4px}
  #tabs a.on{color:var(--ink);background:var(--bg);font-weight:600}
  h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:26px 0 6px}
  h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:17px;margin:18px 0 6px;letter-spacing:-.01em}
  .sub{color:var(--soft);font-size:13.5px;margin:0 0 14px}
  .na{color:var(--soft);font-style:italic;font-size:12.5px}
  .mono{font-family:"IBM Plex Mono",monospace;font-weight:600}
  .hero{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
  .stat{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px}
  .stat .n{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;display:block;line-height:1;margin-bottom:6px}
  .stat .n.good{color:var(--pandan)} .stat .n.hot{color:var(--sambal)} .stat .n.warm{color:var(--turmeric)}
  .stat p{margin:0;font-size:12px;color:var(--soft);line-height:1.35}
  .row{display:flex;gap:16px;align-items:center;margin:10px 0}
  .legend{font-size:12.5px;display:grid;gap:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:2px;color:#fff;white-space:nowrap}
  .chip.na{background:#C9D0C2;color:var(--soft)}
  .btn{display:inline-block;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer;margin:0 6px 8px 0;color:var(--ink)}
  .btn.primary{background:var(--deep);color:#fff;border-color:var(--deep)}
  .btn.danger{color:var(--sambal);border-color:var(--sambal)}
  .list{margin-top:10px}
  .meal{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:12px;margin-bottom:8px;cursor:pointer}
  .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seq{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft)}
  .lab{font-weight:600;flex:1}
  .mm{font-size:12px;color:var(--soft);margin-top:4px}
  .mn{font-size:12.5px;color:var(--soft);margin-top:6px;border-top:1px solid var(--rule);padding-top:6px}
  .seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:4px;margin-bottom:8px}
  .seg button{flex:1;border:0;background:transparent;font:inherit;font-size:12.5px;padding:8px 4px;border-radius:3px;cursor:pointer;color:var(--soft)}
  .seg button.on{background:var(--bg);color:var(--ink);font-weight:600}
  .nalist{font-size:13px;color:var(--soft);padding-left:18px}
  ul.src{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--soft);padding-left:16px;line-height:1.6}
  .lens{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px;margin-bottom:12px}
  .lens h3{margin-top:0}
  .lens .basis{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--soft);margin:0 0 10px}
  .lens ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--soft)}
  .lens li{margin-bottom:6px}
  .rec{border-left:3px solid var(--rule);padding:8px 0 8px 14px;margin-bottom:10px}
  .rec.more{border-color:var(--pandan)} .rec.less{border-color:var(--sambal)}
  .rec p{margin:4px 0;font-size:13.5px;color:var(--soft)}
  .rec .src,.alert .src{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--soft)}
  .alert{background:var(--surface);border:1px solid var(--rule);border-left-width:4px;border-radius:4px;padding:12px;margin-bottom:10px}
  .alert.red{border-left-color:var(--sambal)} .alert.amber{border-left-color:var(--turmeric)}
  .ah{display:flex;gap:8px;align-items:center}
  .alert p{margin:6px 0;font-size:13.5px;color:var(--soft)}
  .ok{background:#EAF0E6;border:1px solid var(--pandan);border-radius:4px;padding:14px;color:var(--pandan)}
  .search{width:100%;padding:10px;border:1px solid var(--rule);border-radius:4px;font:inherit;background:var(--surface);margin:6px 0 10px}
  .lib{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:12px;margin-bottom:8px}
  .lh .cat{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--soft);margin-left:8px}
  .lg{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px;margin:8px 0}
  .flags i{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-style:normal;background:var(--bg);padding:2px 6px;border-radius:2px;margin-right:4px;color:var(--soft)}
  .ls{font-size:11px;color:var(--soft);margin-top:8px;border-top:1px solid var(--rule);padding-top:6px}
  .ls em{color:var(--turmeric)} .conf{font-family:"IBM Plex Mono",monospace}
  .ver{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft);margin-top:30px}
  #modal{display:none;position:fixed;inset:0;background:rgba(19,23,15,.45);z-index:20;overflow:auto;padding:20px 12px}
  #modal.open{display:block}
  .mbox{background:var(--surface);border-radius:6px;padding:18px;max-width:560px;margin:0 auto}
  .mbox h2{margin-top:0}
  .mbox label{display:block;font-size:12px;color:var(--soft);margin:10px 0 4px}
  .mbox input,.mbox select,.mbox textarea{width:100%;padding:9px;border:1px solid var(--rule);border-radius:4px;font:inherit;background:#fff;margin-top:3px}
  .mbox textarea{min-height:60px}
  .mbox .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink)} .mbox .chk input{width:auto;margin:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hit{padding:8px 10px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:13.5px}
  .hit .cat{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--soft)}
  .picked{margin:8px 0}
  .tag{display:inline-block;background:var(--bg);border-radius:3px;padding:4px 8px;font-size:12.5px;margin:0 6px 6px 0}
  .tag b{margin-left:6px;cursor:pointer;color:var(--sambal)}
  .rating{background:var(--bg);border-radius:4px;padding:10px;margin:12px 0;font-size:13px}
  .rating ul{margin:6px 0 0;padding-left:18px;color:var(--soft);font-size:12.5px}
  .mbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .fld{display:block;font-size:12px;color:var(--soft);margin:10px 0 4px}
  .fld input{width:100%;padding:9px;border:1px solid var(--rule);border-radius:4px;font:inherit;background:#fff;margin-top:3px}
  .thumb{width:100%;max-height:220px;object-fit:cover;border-radius:4px;margin:8px 0}
  .thumb.sm{max-height:120px;margin-top:8px}
  .aibox{background:#F3F6F1;border:1px solid var(--pandan);border-radius:4px;padding:14px;margin:12px 0}
  .aibox.err{border-color:var(--sambal);background:#F7EDEB}
  .aih{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
  .aih .mono{font-size:10px;color:var(--soft)}
  .overall{font-size:14.5px;margin:0 0 10px}
  .aisec{font-size:13px;margin:8px 0;padding-top:8px;border-top:1px solid var(--rule)}
  .aisec b{display:inline-block;min-width:78px;color:var(--ink)}
  .aisec ul{margin:4px 0 0;padding-left:18px;color:var(--soft)}
  .aisec.ask{background:#FFF7E6;border:1px solid var(--turmeric);border-radius:3px;padding:8px 10px}
  .aisec.na{color:var(--soft)}
  .cites{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--soft);margin-top:3px}
  .disc{font-size:11px;color:var(--soft);margin:10px 0 0;font-style:italic}
  .mn.ai{color:var(--pandan)}
  pre{white-space:pre-wrap;font-size:11px;background:#fff;padding:8px;border-radius:3px}
</style>
</head>
<body>
<header><h1>MealTrend</h1><span id="badge"></span><span class="v" id="ver"></span></header>

<script>
// ============================================================
// FOOD LIBRARY — single source of truth
// Every figure carries: value, band, source, confidence (0–100, subjective calibration)
// null = not measured / not available. Never estimated.
// ============================================================

const SRC = {
  KANEKO: "Kaneko K, Aoyagi Y, Fukuuchi T, Inazawa K, Yamaoka N. Biol Pharm Bull 2014;37(5):709–721 (HPLC, 270 foods) — read via secondary tabulation",
  HENRY:  "Henry CJ, Quek RYC, Kaur B, Shyam S, Gilcharan Singh HK. Nutr Diabetes 2021;11:2 — Table 1 read directly",
  SUN:    "Sun L, Lee DEM, Tan WJK, Ranawana DV, Quek YCR, Goh HJ, Henry CJ. Br J Nutr 2015;113(5):843–848",
  CHIA:   "Chia M. J Obes Wt Loss Ther 2012;S2:001 (OMICS supplement; n=11 athletes) — quality concern",
  ATK:    "Atkinson FS, Brand-Miller JC, Foster-Powell K, Buyken AE, Goletzke J. Am J Clin Nutr 2021;114(5):1625–32",
  HPB:    "HealthHub / Health Promotion Board Singapore, GI values of common foods, reviewed 26 Jun 2025",
  USDA:   "USDA FoodData Central, via Wikipedia sourced infobox",
  USDA2:  "USDA FoodData Central averages, via secondary chart (chartfarosh.com)",
  PANEL:  "Manufacturer nutrition panel, photographed",
  LABEL:  "Product label (Heineken / San Miguel / Peroni), via steadydrinker.com",
  BJN_BEER:"Br J Nutr (Cambridge), Netherlands beer study co-authored by Atkinson & Brand-Miller — pilsner, GI 89±5",
  WINE:   "Synthesised range: wine.com, Wine Insiders, Japan Standard Tables via fusubon.com",
  MY:     "Malaysian study in Henry 2021 compendium (T2DM participants where noted)",
  FSA:    "UK Food Standards Agency front-of-pack thresholds: sugar ≤5 low, 5–22.5 medium, >22.5 high per 100g"
};

// Purine bands (Kaneko / Japanese guideline): vlow <50, low 50–100, mod 100–200, high 200–300, vhigh >300
function pBand(v){ if(v==null) return null; if(v<50) return "vlow"; if(v<100) return "low"; if(v<200) return "mod"; if(v<300) return "high"; return "vhigh"; }
// GI bands (Sydney / HPB): low ≤55, med 56–69, high ≥70
function gBand(v){ if(v==null) return null; if(v<=55) return "low"; if(v<=69) return "med"; return "high"; }
// Sugar bands (FSA)
function sBand(v){ if(v==null) return null; if(v<=5) return "low"; if(v<=22.5) return "med"; return "high"; }

<script>
// ============================================================
// MEALTREND — app logic
// Version stamp convention: vYYYY:MMM:DD-HH:MM (Asia/Singapore)
// ============================================================
const VERSION = "v2026:SEP:06-00:00"; // HH:MM approximate — device clock unavailable; set on first edit

const LS_KEY = "mealtrend.v1";
const BANDS = {
  purine: { vlow:{l:"Very low",c:"#1F4D46"}, low:{l:"Low",c:"#3B6B45"}, mod:{l:"Moderate",c:"#B87C12"}, high:{l:"High",c:"#AF3324"}, vhigh:{l:"Very high",c:"#7A1F14"} },
  gi:     { low:{l:"Low",c:"#3B6B45"}, med:{l:"Medium",c:"#B87C12"}, high:{l:"High",c:"#AF3324"} },
  sugar:  { low:{l:"Low",c:"#3B6B45"}, med:{l:"Medium",c:"#B87C12"}, high:{l:"High",c:"#AF3324"} },
  rating: { vlow:{l:"Very low",c:"#1F4D46"}, low:{l:"Low",c:"#3B6B45"}, moderate:{l:"Moderate",c:"#B87C12"}, high:{l:"High",c:"#AF3324"} }
};
const RANK = { vlow:0, low:1, moderate:2, mod:2, high:3, vhigh:4 };
const FOOD = Object.fromEntries(FOODS.map(f=>[f.id,f]));

// ---------- STORE ----------
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.meals) return s; }catch(e){}
  return { meals: SEED_MEALS.map(m=>({...m, id:"seed"+m.seq, source:"conversation log"})), settings:{} };
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
let STATE = load();

// ---------- RATING ENGINE (for new meals; seeded meals keep logged rating) ----------
function rateMeal(m){
  const items = m.items.map(id=>FOOD[id]).filter(Boolean);
  const flags = new Set(items.flatMap(f=>f.flags||[]));
  let rank = 0; const why=[];
  items.forEach(f=>{ if(f.purine.band){ rank=Math.max(rank,RANK[f.purine.band]); } });
  const top=items.filter(f=>f.purine.band && RANK[f.purine.band]===rank).map(f=>f.name).slice(0,2).join(", ");
  if(rank>=3) why.push(`high-band purine item: ${top}`);
  else if(rank===2) why.push(`moderate-band purine item: ${top}`);
  if(flags.has("dried_seafood")){ rank=Math.max(rank,3); why.push("dried seafood present — concentrated purine (confirmed)"); }
  else if(flags.has("dried_seafood_likely")){ rank=Math.max(rank,2); why.push("dried seafood conventional in this gravy but unconfirmed — ask the stall"); }
  if(flags.has("organ")){ rank=Math.max(rank,3); why.push("organ meat present"); }
  if(m.liquid==="gravy"||m.liquid==="concentrated"){ rank=Math.max(rank,2); why.push("concentrated liquid consumed — purines extract into liquid"); }
  else if(m.liquid==="clear"){ why.push("clear stock only — extraction mild; rating follows the solids"); }
  else if(!flags.has("dried_seafood")){ if(rank<3){ rank=Math.min(rank,1); } why.push("dry-cooked, no dried seafood — nothing extracted into a liquid"); }
  const plantOrZero = items.length && items.every(f=>f.purine.v===0 || (f.purine.v!=null && f.purine.v<50) || (f.purine.v==null && ["fruit","vegetable","drink","cake","dessert","cereal","fat","sauce","curry"].includes(f.cat)));
  if(plantOrZero && m.liquid==="none" && !flags.has("dried_seafood")) return {rating:"vlow", why:["no meaningful purine source, no liquid"]};
  rank=Math.min(rank,3);
  const map=["vlow","low","moderate","high"];
  return { rating: map[Math.max(rank,1)], why };
}

// ---------- ANALYSIS ----------
function analyse(meals){
  const n = meals.length;
  const byRating = {vlow:0,low:0,moderate:0,high:0};
  meals.forEach(m=>byRating[m.rating]++);
  const liquid = meals.filter(m=>m.liquid!=="none");
  const dry = meals.filter(m=>m.liquid==="none");
  const liquidElevated = liquid.filter(m=>RANK[m.rating]>=2).length;
  const dryLow = dry.filter(m=>RANK[m.rating]<=1).length;
  const dryNoSea = dry.filter(m=>!m.items.some(id=>FOOD[id]?.flags?.includes("dried_seafood")));
  const dryNoSeaLow = dryNoSea.filter(m=>RANK[m.rating]<=1).length;
  const flagCount = {};
  const catCount = {};
  meals.forEach(m=>m.items.forEach(id=>{ const f=FOOD[id]; if(!f) return; (f.flags||[]).forEach(fl=>flagCount[fl]=(flagCount[fl]||0)+1); catCount[f.cat]=(catCount[f.cat]||0)+1; }));
  const gravy = meals.filter(m=>m.liquid==="gravy").length;
  const clear = meals.filter(m=>m.liquid==="clear").length;
  const checked = meals.filter(m=>m.checked).length;
  const highGI = meals.filter(m=>m.items.some(id=>FOOD[id]?.gi?.band==="high")).length;
  const starch = meals.filter(m=>m.items.some(id=>["rice","rice dish","noodle","noodle dish","bread","bun","cake","snack"].includes(FOOD[id]?.cat))).length;
  const sweet = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("sweetened"))).length;
  const dairy = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("dairy"))).length;
  const egg = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("egg"))).length;
  const plant = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("plant_protein"))).length;
  const driedSea = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("dried_seafood"))).length;
  const alcohol = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("alcohol"))).length;
  const organ = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("organ"))).length;
  return { n, byRating, liquid:liquid.length, dry:dry.length, liquidElevated, dryLow, dryNoSea:dryNoSea.length, dryNoSeaLow, gravy, clear, checked, highGI, starch, sweet, dairy, egg, plant, driedSea, alcohol, organ, catCount };
}

// ---------- ALERTS ----------
// Works on dates if present, otherwise treats consecutive sequence entries as adjacent days.
function windowOf(meals, i, days){
  const m = meals[i];
  if(m.date){ const t=new Date(m.date).getTime(); return meals.filter(x=>x.date && Math.abs(new Date(x.date).getTime()-t) <= days*86400000); }
  // no date: only meals explicitly linked as same-day count
  const linked = meals.filter(x=>x.sameDayAs===m.seq || m.sameDayAs===x.seq || (x.sameDayAs && x.sameDayAs===m.sameDayAs));
  return [m, ...linked.filter(x=>x!==m)];
}
function alerts(meals){
  const out=[];
  const sorted=[...meals].sort((a,b)=>(a.seq||0)-(b.seq||0));
  const has=(m,fl)=>m.items.some(id=>FOOD[id]?.flags?.includes(fl));
  sorted.forEach((m,i)=>{
    const w1 = windowOf(sorted,i,1), w2 = windowOf(sorted,i,2);
    const dried = w1.filter(x=>has(x,"dried_seafood")).length;
    if(dried>=2 && has(m,"dried_seafood")) out.push({lvl:"red", seq:m.seq, t:"Two dried-seafood meals within a day", d:"This is the exact pattern of the flare day (meals 1 and 2). Dried anchovy is 1,109 mg/100g — roughly 36 g reaches the 400 mg daily ceiling alone.", src:GUIDE.purine_window_days.src});
    if(has(m,"organ")) out.push({lvl:"red", seq:m.seq, t:"Organ meat", d:"Liver 285–312 mg/100g, high band. ACR 2020 conditionally recommends limiting.", src:"ACR 2020 gout guideline"});
    const conc = w2.filter(x=>x.liquid==="gravy"||x.liquid==="concentrated").length;
    if(conc>=2 && (m.liquid==="gravy"||m.liquid==="concentrated")) out.push({lvl:"amber", seq:m.seq, t:"Two concentrated gravies within 48 hours", d:"The 2-day intake window is what predicted recurrent flares in Zhang 2012 (top quintile OR 4.76). Leave a third of the gravy.", src:GUIDE.purine_window_days.src});
    if(has(m,"alcohol")) out.push({lvl:"amber", seq:m.seq, t:"Alcohol", d:"Beer had the strongest gout association of any beverage in Choi 2004 — despite near-zero sugar. Mechanism is ethanol, not purine.", src:GUIDE.alcohol.src});
    const sw = w1.filter(x=>has(x,"sweetened")).length;
    if(sw>=2 && has(m,"sweetened")) out.push({lvl:"amber", seq:m.seq, t:"Two sweetened items within a day", d:"WHO: free sugars <10% energy (≈50 g), ideally <5% (≈25 g). Only two items in the library carry a measured sugar figure — this alert counts flags, not grams.", src:GUIDE.free_sugar_g.src});
    const hg = w1.filter(x=>x.items.some(id=>FOOD[id]?.gi?.band==="high")).length;
    if(hg>=2 && m.items.some(id=>FOOD[id]?.gi?.band==="high")) out.push({lvl:"amber", seq:m.seq, t:"Two high-GI starch meals within a day", d:"Pattern flag, not a guideline threshold — no daily GI limit exists. Composition lowers it: rice 96 → 50 with oil, protein and vegetables in the same study.", src:GUIDE.gi_daily.src});
  });
  // dedupe by seq+title
  const seen=new Set(); return out.filter(a=>{const k=a.seq+a.t; if(seen.has(k)) return false; seen.add(k); return true;});
}

// ---------- RECOMMENDATIONS (rule-based, computed from the log) ----------
function recommend(A){
  const more=[], less=[];
  const pct=x=>Math.round(100*x/A.n);
  // MORE
  more.push({t:"Eggs and dairy", d:`Egg is 0 mg purine; milk 0 and carries a protective association (Choi 2004). Present in ${A.egg} and ${A.dairy} of ${A.n} meals.`, src:"Kaneko 2014; Choi NEJM 2004"});
  more.push({t:"Dry-cooked protein, no dried garnish", d:`${A.dryNoSeaLow} of ${A.dryNoSea} dry-cooked meals without dried seafood rated Low or below. Grilled, pan-seared, stir-fried, dry-tossed.`, src:"This log"});
  more.push({t:"Tofu, tempeh, bee hoon over yellow noodle", d:`Plant purines carry a weaker flare signal (Zhang 2012: OR 1.39 vs 2.41 animal). Bee hoon GI 35 — lowest of 15 Singapore foods tested.`, src:"Zhang 2012; Sun 2015"});
  more.push({t:"Rice with fat, protein and vegetables — not alone", d:"Plain rice 96 → 50 in the same study when oil, chicken and vegetables were added. Your chicken-thigh-tempeh plate already does this.", src:"Henry 2021 compendium, Singapore rice study"});
  more.push({t:"Sugarless drinks", d:`Three logged already (Coke Zero, teh tarik kosong, plain tea). Removes the fructose mechanism entirely.`, src:"ACR 2020 (conditional, low certainty)"});
  // LESS
  if(A.driedSea) less.push({t:"Dried seafood garnishes", d:`${A.driedSea} meals. Ikan bilis 1,109 mg/100g — 9× chicken. Skip the garnish; keep the rice and chicken.`, src:"Kaneko 2014"});
  if(A.gravy) less.push({t:"Concentrated rempah gravies, drunk", d:`${A.gravy} meals (${pct(A.gravy)}%). ${A.liquidElevated} of ${A.liquid} liquid meals rated Moderate or above. Leave a third of the gravy — the solids were fine every time.`, src:"This log; water-soluble purine extraction"});
  less.push({t:"Shell-on prawn in shellfish stock", d:"Prawn 53–273 mg/100g by species, plus shellfish stock extraction, plus a fried bun as sponge — three factors stacked in one meal.", src:"Kaneko 2014"});
  if(A.sweet) less.push({t:"Sweetened gravies and dips", d:`${A.sweet} meals with a sweetened element. Mee siam, sweet-and-sour, sambal, chilli prawn. Only the snowskin (30.9 g/100g) has a measured figure.`, src:"FSA bands; WHO 2015"});
  less.push({t:"Two risk meals in one day", d:"The flare day was two ikan bilis meals within hours. The 48-hour window, not the single plate, is the unit that matters.", src:"Zhang 2012"});
  return {more, less};
}

// ---------- SVG CHART HELPERS ----------
const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:'IBM Plex Sans',sans-serif">${inner}</svg>`;
function hbars(rows, opts={}){ // rows: [{label, v, band, color, conf}]
  const W=360, rowH=26, pad=4, labW=opts.labW||150, maxV=opts.max||Math.max(...rows.map(r=>r.v||0),1);
  const H=rows.length*rowH+pad*2;
  let s="";
  rows.forEach((r,i)=>{
    const y=pad+i*rowH; const bw=Math.max(2,(W-labW-60)*(r.v||0)/maxV);
    s+=`<text x="0" y="${y+17}" font-size="11" fill="#13170F">${esc(r.label)}</text>`;
    s+=`<rect x="${labW}" y="${y+6}" width="${bw}" height="14" rx="2" fill="${r.color}"/>`;
    s+=`<text x="${labW+bw+6}" y="${y+17}" font-size="11" font-family="IBM Plex Mono" fill="#13170F">${r.v==null?"n/a":r.v}</text>`;
    if(r.conf!=null) s+=`<text x="${W}" y="${y+17}" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono" fill="#5D6656">${r.conf}%</text>`;
  });
  return svg(W,H,s);
}
function stackedSeq(meals){ // rating over sequence
  const W=360,H=120,pad=6; const n=meals.length; const bw=(W-pad*2)/n;
  let s=`<line x1="${pad}" y1="${H-20}" x2="${W-pad}" y2="${H-20}" stroke="#C9D0C2"/>`;
  meals.forEach((m,i)=>{ const h=(RANK[m.rating]+1)*20; const c=BANDS.rating[m.rating].c;
    s+=`<rect x="${pad+i*bw+1}" y="${H-20-h}" width="${Math.max(2,bw-2)}" height="${h}" fill="${c}" rx="1"><title>#${m.seq} ${esc(m.label)} — ${BANDS.rating[m.rating].l}</title></rect>`;
    if(m.liquid!=="none") s+=`<circle cx="${pad+i*bw+bw/2}" cy="${H-10}" r="2.5" fill="${m.liquid==="clear"?"#B87C12":"#AF3324"}"/>`;
  });
  return svg(W,H,s);
}
function donut(parts){ // [{v,color,label}]
  const total=parts.reduce((a,p)=>a+p.v,0)||1; const R=44, r=28, cx=60, cy=60; let a0=-Math.PI/2; let s="";
  parts.forEach(p=>{ const a1=a0+2*Math.PI*p.v/total; const large=(a1-a0)>Math.PI?1:0;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const xi0=cx+r*Math.cos(a1),yi0=cy+r*Math.sin(a1),xi1=cx+r*Math.cos(a0),yi1=cy+r*Math.sin(a0);
    if(p.v>0) s+=`<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${xi0},${yi0} A${r},${r} 0 ${large} 0 ${xi1},${yi1} Z" fill="${p.color}"><title>${esc(p.label)}: ${p.v}</title></path>`;
    a0=a1; });
  return svg(120,120,s);
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

    <label class="chk"><input type="checkbox" ${ADD.checked?'checked':''} onchange="ADD.checked=this.checked"> Ingredient checked with cook / stall</label>
    <label class="fld">Photo <input type="file" accept="image/*" capture="environment" onchange="onPhoto(this)"></label>
    ${ADD.thumb?`<img class="thumb" src="data:image/jpeg;base64,${ADD.thumb}" alt="">`:""}
    <button id="aiBtn" class="btn primary" onclick="runMealAI()" ${AI.ready()?"":"disabled title='Add API key under More → AI'"}>${ADD.ai?"Re-analyse with AI":"Analyse with AI"}${PENDING_IMG?" (photo)":""}</button>
    ${renderAI(ADD.ai)}
    <label>Foods <input class="search" placeholder="type to add…" oninput="pickList(this.value)"></label>
    <div id="pick"></div>
    <div class="picked">${ADD.items.map(id=>`<span class="tag">${esc(FOOD[id]?.name||id)}<b onclick="ADD.items=ADD.items.filter(x=>x!=='${id}');renderModal()">×</b></span>`).join("")}</div>
    <label>Note<textarea oninput="ADD.note=this.value">${esc(ADD.note||'')}</textarea></label>
    <div class="rating"><b>Computed rating:</b> ${chip(r.rating,'rating')}<ul>${r.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>${ADD.source?`<p class="sub">Logged rating was <b>${BANDS.rating[ADD.rating].l}</b>. Saving keeps the computed one.</p>`:''}</div>
    <div class="mbtn"><button class="btn primary" onclick="saveMeal()">Save</button><button class="btn" onclick="closeModal()">Cancel</button>${ADD.source?'':`<button class="btn danger" onclick="delMeal()">Delete</button>`}</div>
  </div>`;
  $("#modal").classList.add("open");
}
function pickList(q){ q=q.toLowerCase(); if(!q){$("#pick").innerHTML="";return;} const hits=FOODS.filter(f=>f.name.toLowerCase().includes(q)&&!ADD.items.includes(f.id)).slice(0,8);
  $("#pick").innerHTML=hits.map(f=>`<div class="hit" onclick="ADD.items.push('${f.id}');renderModal()">${esc(f.name)} <span class="cat">${esc(f.cat)}</span></div>`).join(""); }
function saveMeal(){ if(!ADD.label.trim()){alert("Give the meal a label.");return;} const r=rateMeal(ADD); ADD.rating=r.rating; delete ADD.source;
  const i=STATE.meals.findIndex(x=>x.id===ADD.id); if(i>=0) STATE.meals[i]=ADD; else STATE.meals.push(ADD); save(); closeModal(); route(); }
function delMeal(){ if(!confirm("Delete this meal?")) return; STATE.meals=STATE.meals.filter(x=>x.id!==ADD.id); save(); closeModal(); route(); }
function closeModal(){ $("#modal").classList.remove("open"); $("#modal").innerHTML=""; }

// ---------- EXPORT / IMPORT ----------
function exportJSON(){ const b=new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`mealtrend-${new Date().toISOString().slice(0,10)}.json`; a.click(); }
function importJSON(inp){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const s=JSON.parse(rd.result); if(!s.meals) throw 0; STATE=s; save(); route(); alert("Imported "+s.meals.length+" meals."); }catch(e){ alert("Not a valid MealTrend export."); } }; rd.readAsText(f); }

// ---------- ROUTER ----------
const TABS=[["dash","Home"],["log","Log"],["rank","Rank"],["lens","Advice"],["alerts","Alerts"],["lib","Library"],["set","More"]];
let RANKKIND="purine";
function route(){
  const h=(location.hash||"#dash").slice(1);
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${h===k?'on':''}">${l}</a>`).join("");
  let body="";
  if(h==="dash") body=viewDashboard();
  else if(h==="log") body=viewLog();
  else if(h==="rank") body=`<div class="seg">${[["purine","Purine"],["gi","GI"],["sugar","Sugar"],["chol","Cholesterol"]].map(([k,l])=>`<button class="${RANKKIND===k?'on':''}" onclick="RANKKIND='${k}';route()">${l}</button>`).join("")}</div>`+viewRankings(RANKKIND);
  else if(h==="lens") body=viewLenses();
  else if(h==="alerts") body=viewAlerts();
  else if(h==="lib") body=viewLibrary();
  else body=viewSettings();
  $("#view").innerHTML=body;
  const badge=alerts(STATE.meals).filter(a=>a.lvl==="red").length; $("#badge").textContent=badge?badge:""; $("#badge").style.display=badge?"inline-block":"none";
}
window.addEventListener("hashchange",route);
window.addEventListener("load",()=>{ route(); if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{}); });

</script>
<script>
// ============================================================
// AI DIETITIAN LAYER — bring your own API key
// Key lives in localStorage on this device only. Never commit it.
// Every figure the model may cite comes from FOODS / GUIDE. "not available" is a valid answer.
// ============================================================

const AI = {
  key(){ return (STATE.settings||{}).apiKey || ""; },
  model(){ return (STATE.settings||{}).model || "claude-sonnet-5"; },
  ready(){ return !!this.key(); },

  // Compact library the model is allowed to cite from
  libraryText(){
    return FOODS.map(f=>{
      const p=f.purine.v==null?"n/a":f.purine.v+"mg"; const g=f.gi.v==null?(f.gi.band?f.gi.band+"(band)":"n/a"):f.gi.v;
      const s=f.sugar.v==null?"n/a":f.sugar.v+"g"; const c=f.chol.v==null?"n/a":f.chol.v+"mg";
      return `${f.id} | ${f.name} | purine ${p} conf${f.purine.conf??"-"} | GI ${g} conf${f.gi.conf??"-"} | sugar/100g ${s} | chol/100g ${c} | flags ${(f.flags||[]).join(",")||"-"}${f.purine.note?" | note: "+f.purine.note:""}${f.gi.note?" | gi-note: "+f.gi.note:""}`;
    }).join("\n");
  },

  system(){
    return `You are a registered dietitian with sub-specialty experience in rheumatology nutrition (gout / hyperuricaemia) and diabetes nutrition (glycaemic management), working with a Singapore-based adult male who had a single unconfirmed podagra episode after two dried-anchovy meals in one day. You are analysing his meals.

NON-NEGOTIABLE RULES
1. The FOOD LIBRARY below is the ONLY source of numeric figures you may state. If a food or a figure is not in it, write "not available" — do not estimate, do not recall a number from elsewhere.
2. Cite the library id (e.g. [ikan_bilis]) or guideline id (e.g. [GUIDE:purine_window_days]) next to every figure or threshold you use.
3. Never compute a daily purine total in mg. No meal has a weighed portion.
4. Dietary cholesterol has NO guideline threshold (removed from US Dietary Guidelines 2015). Rank and note it; never alarm on it.
5. Do not diagnose. The podagra episode was never clinically confirmed. When relevant, say a serum urate test outranks any dietary inference.
6. Singapore hawker and home dishes vary by stall and kitchen. When an ingredient is conventional but unconfirmed (e.g. hae bee in laksa rempah, belacan in sambal, conpoy in a double-boiled soup), DO NOT assume it. State it as unconfirmed and put a specific question in "questions_to_ask". This user's answers to such questions have lowered the rating 4 times out of 4.
7. Purine rating logic, in order: highest purine band among items → confirmed dried seafood or organ meat forces at least High → a gravy conventionally containing dried seafood (unconfirmed) forces at least Moderate → concentrated liquid or gravy consumed forces at least Moderate → clear gently-simmered stock: rating follows the solids → dry-cooked with no dried seafood: cap at Low unless a High-band item is present.
8. Glycaemic reasoning: GI is per reference food; composite hawker dishes rarely have a tested value. Composition matters more than substitution — in one Singapore study plain white rice measured 96 and the same rice with oil, chicken and vegetables measured 50 [white_rice][rice_oil_chicken_veg]. Say so when the plate has protein/fat/vegetables alongside starch.
9. Be concrete and short. A working dietitian's note, not an essay. Prefer "leave a third of the gravy" over "reduce intake".
10. Return ONLY valid JSON matching the schema. No preamble, no markdown fences.

GUIDELINES (cite by id)
- GUIDE:purine_daily — ${GUIDE.purine_daily_mg.src}. Cannot be computed here.
- GUIDE:purine_window_days — ${GUIDE.purine_window_days.src}
- GUIDE:free_sugar — ${GUIDE.free_sugar_g.src}
- GUIDE:cholesterol — ${GUIDE.cholesterol_mg.src}
- GUIDE:alcohol — ${GUIDE.alcohol.src}
- GUIDE:acr2020 — FitzGerald JD et al. 2020 ACR gout guideline: dietary recommendations are conditional, low-to-very-low certainty; diet moves serum urate ~1.0–1.2 mg/dL.
- GUIDE:choi2004 — Choi HK et al. NEJM 2004: meat and seafood raised incident gout; dairy lowered it; purine-rich vegetables neutral.
- GUIDE:zhang2012_plant — Zhang Y et al. 2012: animal-source purine OR trend 2.41 vs plant 1.39 across quintiles.

FOOD LIBRARY (id | name | purine mg/100g | GI | sugar | cholesterol | flags)
${this.libraryText()}`;
  },

  mealSchema: `{
 "identified_items": [{"name": string, "library_id": string|null, "confidence": 0-100}],
 "liquid_class": "none"|"clear"|"concentrated"|"gravy",
 "purine": {"rating": "vlow"|"low"|"moderate"|"high", "rationale": string, "cites": [string]},
 "glycaemic": {"band": "low"|"medium"|"high"|"not available", "rationale": string, "cites": [string]},
 "sugar": {"note": string, "cites": [string]},
 "lipids": {"note": string, "cites": [string]},
 "sodium_satfat": string,
 "questions_to_ask": [string],
 "what_to_change": [string],
 "what_is_fine": [string],
 "not_available": [string],
 "overall": string
}`,

  reviewSchema: `{
 "headline": string,
 "patterns": [{"pattern": string, "evidence": string, "cites": [string]}],
 "top_risks": [{"risk": string, "why": string, "action": string, "cites": [string]}],
 "top_wins": [{"win": string, "why": string, "cites": [string]}],
 "swaps": [{"from": string, "to": string, "why": string}],
 "open_questions": [string],
 "test_recommendation": string,
 "limits": [string]
}`,

  async call(userContent, maxTokens){
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "content-type":"application/json", "x-api-key":this.key(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:this.model(), max_tokens:maxTokens||1800, system:this.system(), messages:[{role:"user", content:userContent}] })
    });
    if(!res.ok){ const t=await res.text(); throw new Error(`API ${res.status}: ${t.slice(0,300)}`); }
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const clean=text.replace(/^```json\s*|^```\s*|```\s*$/gm,"").trim();
    try{ return { json: JSON.parse(clean), raw:text, usage:data.usage }; }
    catch(e){ return { json:null, raw:text, usage:data.usage, parseError:true }; }
  },

  async analyseMeal(meal, imageB64, mediaType){
    const A=analyse(STATE.meals);
    const context = `LOG CONTEXT: ${A.n} meals so far. Dry-cooked meals without dried seafood rated Low or below ${A.dryNoSeaLow}/${A.dryNoSea}. Liquid meals rated Moderate+ ${A.liquidElevated}/${A.liquid}. Dried seafood in ${A.driedSea} meals. Alcohol ${A.alcohol}, organ meat ${A.organ}. The user checked ingredients ${A.checked} times; every answer lowered the rating.

MEAL TO ANALYSE
label: ${meal.label||"(none)"}
slot: ${meal.slot} · date: ${meal.date||"not recorded"}
items selected by user: ${meal.items.map(id=>FOOD[id]?.name||id).join(", ")||"(none — identify from photo)"}
liquid consumed (user-declared): ${meal.liquid}
ingredient checked with cook/stall: ${meal.checked?"yes":"no"}
user note: ${meal.note||"-"}

Return JSON matching exactly this schema:
${this.mealSchema}`;
    const content=[];
    if(imageB64) content.push({type:"image", source:{type:"base64", media_type:mediaType||"image/jpeg", data:imageB64}});
    content.push({type:"text", text:context});
    return this.call(content, 1800);
  },

  async reviewLog(){
    const A=analyse(STATE.meals);
    const meals=[...STATE.meals].sort((a,b)=>a.seq-b.seq).map(m=>`#${m.seq} ${m.date||"undated"} ${m.slot} | ${m.label} | items: ${m.items.join(",")} | liquid: ${m.liquid} | checked: ${m.checked?"y":"n"} | rating: ${m.rating}${m.ai?.purine?.rating?` | ai: ${m.ai.purine.rating}`:""}${m.note?` | note: ${m.note}`:""}`).join("\n");
    const stats=`STATS: n=${A.n}; ratings ${JSON.stringify(A.byRating)}; dry ${A.dry} (no-dried-seafood ${A.dryNoSea}, of which Low ${A.dryNoSeaLow}); liquid ${A.liquid} (elevated ${A.liquidElevated}); gravy ${A.gravy}; clear ${A.clear}; dried seafood ${A.driedSea}; sweetened ${A.sweet}; high-GI ${A.highGI}; starch ${A.starch}; dairy ${A.dairy}; egg ${A.egg}; plant protein ${A.plant}; alcohol ${A.alcohol}; organ ${A.organ}; checked ${A.checked}.`;
    const text=`Write a dietitian's review of this meal log. Be specific to what is actually in the log. Do not invent meals or figures.

${stats}

MEAL LOG
${meals}

Return JSON matching exactly this schema:
${this.reviewSchema}`;
    return this.call([{type:"text", text}], 2200);
  }
};

// ---------- image helpers ----------
function fileToResized(file, maxPx, quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1, maxPx/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      const dataUrl=c.toDataURL("image/jpeg",quality); resolve(dataUrl.split(",")[1]); };
    img.onerror=reject; img.src=url;
  });
}

// ---------- UI hooks ----------
let PENDING_IMG=null; // full-res base64 for the API call; not persisted
async function onPhoto(inp){
  const f=inp.files[0]; if(!f) return;
  PENDING_IMG = await fileToResized(f, 1280, 0.82);
  ADD.thumb = await fileToResized(f, 420, 0.6);
  renderModal();
}
async function runMealAI(){
  if(!AI.ready()){ alert("Add your API key under More → AI. It stays on this device."); return; }
  const btn=$("#aiBtn"); btn.disabled=true; btn.textContent="Analysing…";
  try{
    const r=await AI.analyseMeal(ADD, PENDING_IMG, "image/jpeg");
    if(r.parseError){ ADD.ai={error:"Model returned non-JSON", raw:r.raw}; }
    else { ADD.ai=r.json; ADD.ai.model=AI.model(); ADD.ai.at=new Date().toISOString(); ADD.ai.usage=r.usage;
      // adopt identified items the user hasn't already added, when they map to the library
      (ADD.ai.identified_items||[]).forEach(it=>{ if(it.library_id && FOOD[it.library_id] && !ADD.items.includes(it.library_id) && it.confidence>=60) ADD.items.push(it.library_id); });
      if(ADD.ai.liquid_class && ADD.liquid==="none" && ADD.ai.liquid_class!=="none") ADD.liquid=ADD.ai.liquid_class;
      if(!ADD.label && ADD.ai.identified_items?.length) ADD.label=ADD.ai.identified_items.slice(0,3).map(i=>i.name).join(", ");
    }
  }catch(e){ ADD.ai={error:String(e.message||e)}; }
  renderModal();
}
async function runLogAI(){
  if(!AI.ready()){ alert("Add your API key under More → AI."); return; }
  const box=$("#reviewBox"); box.innerHTML=`<p class="sub">Reviewing ${STATE.meals.length} meals…</p>`;
  try{ const r=await AI.reviewLog(); if(r.parseError) throw new Error("Model returned non-JSON: "+r.raw.slice(0,200));
    STATE.review={...r.json, model:AI.model(), at:new Date().toISOString(), usage:r.usage}; save(); box.innerHTML=renderReview(STATE.review);
  }catch(e){ box.innerHTML=`<p class="alert red">${esc(e.message)}</p>`; }
}
function renderAI(ai){
  if(!ai) return "";
  if(ai.error) return `<div class="aibox err"><b>AI analysis failed</b><p>${esc(ai.error)}</p>${ai.raw?`<pre>${esc(ai.raw.slice(0,600))}</pre>`:""}</div>`;
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const cites=c=>(c||[]).length?`<span class="cites">${(c||[]).map(esc).join(" ")}</span>`:"";
  return `<div class="aibox">
    <div class="aih"><b>AI dietitian note</b><span class="mono">${esc(ai.model||"")}</span></div>
    <p class="overall">${esc(ai.overall||"")}</p>
    ${ai.identified_items?.length?`<div class="aisec"><b>Identified</b> ${ai.identified_items.map(i=>`<span class="tag">${esc(i.name)}${i.library_id?"":" <em>(not in library)</em>"} <span class="mono">${i.confidence}%</span></span>`).join("")}</div>`:""}
    <div class="aisec"><b>Purine</b> ${chip(ai.purine?.rating,'rating')} <span>${esc(ai.purine?.rationale||"")}</span> ${cites(ai.purine?.cites)}</div>
    <div class="aisec"><b>Glycaemic</b> ${ai.glycaemic?.band&&ai.glycaemic.band!=="not available"?chip(ai.glycaemic.band==="medium"?"med":ai.glycaemic.band,'gi'):'<span class="na">not available</span>'} <span>${esc(ai.glycaemic?.rationale||"")}</span> ${cites(ai.glycaemic?.cites)}</div>
    ${ai.sugar?.note?`<div class="aisec"><b>Sugar</b> ${esc(ai.sugar.note)} ${cites(ai.sugar.cites)}</div>`:""}
    ${ai.lipids?.note?`<div class="aisec"><b>Lipids</b> ${esc(ai.lipids.note)} ${cites(ai.lipids.cites)}</div>`:""}
    ${ai.sodium_satfat?`<div class="aisec"><b>Sodium / sat fat</b> ${esc(ai.sodium_satfat)}</div>`:""}
    ${ai.questions_to_ask?.length?`<div class="aisec ask"><b>Ask before assuming</b><ul>${li(ai.questions_to_ask)}</ul></div>`:""}
    ${ai.what_to_change?.length?`<div class="aisec"><b>Change</b><ul>${li(ai.what_to_change)}</ul></div>`:""}
    ${ai.what_is_fine?.length?`<div class="aisec"><b>Fine as is</b><ul>${li(ai.what_is_fine)}</ul></div>`:""}
    ${ai.not_available?.length?`<div class="aisec na"><b>Not available</b><ul>${li(ai.not_available)}</ul></div>`:""}
    <p class="disc">Generated by a language model constrained to the food library. Not a licensed dietitian. Not a diagnosis.</p>
  </div>`;
}
function renderReview(r){
  if(!r) return "";
  const cites=c=>(c||[]).length?`<span class="cites">${(c||[]).map(esc).join(" ")}</span>`:"";
  return `<div class="aibox">
    <div class="aih"><b>Dietitian review</b><span class="mono">${esc(r.model||"")} · ${(r.at||"").slice(0,10)}</span></div>
    <p class="overall">${esc(r.headline||"")}</p>
    <h3>Patterns</h3>${(r.patterns||[]).map(p=>`<div class="rec"><b>${esc(p.pattern)}</b><p>${esc(p.evidence)}</p>${cites(p.cites)}</div>`).join("")}
    <h3>Top risks</h3>${(r.top_risks||[]).map(p=>`<div class="rec less"><b>${esc(p.risk)}</b><p>${esc(p.why)}</p><p><b>Do:</b> ${esc(p.action)}</p>${cites(p.cites)}</div>`).join("")}
    <h3>Top wins</h3>${(r.top_wins||[]).map(p=>`<div class="rec more"><b>${esc(p.win)}</b><p>${esc(p.why)}</p>${cites(p.cites)}</div>`).join("")}
    ${r.swaps?.length?`<h3>Swaps</h3>${r.swaps.map(s=>`<div class="rec"><b>${esc(s.from)} → ${esc(s.to)}</b><p>${esc(s.why)}</p></div>`).join("")}`:""}
    ${r.open_questions?.length?`<h3>Open questions</h3><ul class="sub">${r.open_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}
    ${r.test_recommendation?`<div class="rec"><b>Test</b><p>${esc(r.test_recommendation)}</p></div>`:""}
    ${r.limits?.length?`<h3>Limits of this review</h3><ul class="sub">${r.limits.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}
    <p class="disc">Generated by a language model constrained to the food library and cited guidelines. Not a licensed dietitian. Not a diagnosis.</p>
  </div>`;
}
function saveAISettings(){ STATE.settings=STATE.settings||{}; STATE.settings.apiKey=$("#apiKey").value.trim(); STATE.settings.model=$("#aiModel").value.trim()||"claude-sonnet-5"; save(); alert("Saved on this device."); }
function viewAISettings(){
  const s=STATE.settings||{};
  return `<h2>AI dietitian</h2>
  <p class="sub">Bring your own Anthropic API key. It is stored in this browser's localStorage only — never in the repo, never sent anywhere except api.anthropic.com. Anyone with access to this device can read it. Do not paste it into a shared computer.</p>
  <label class="fld">API key<input id="apiKey" type="password" value="${esc(s.apiKey||"")}" placeholder="sk-ant-…"></label>
  <label class="fld">Model<input id="aiModel" value="${esc(s.model||"claude-sonnet-5")}"></label>
  <button class="btn primary" onclick="saveAISettings()">Save</button>
  <p class="sub">Each meal analysis with a photo costs a few cents. The model is instructed to use only the food library's figures and to answer "not available" otherwise — but it is still a language model, and this app's own history includes errors that structure alone did not prevent. Treat its output as a draft note from a well-briefed assistant, not as clinical advice.</p>`;
}

</script>
<script>document.getElementById("ver").textContent=VERSION;</script>
