<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MealTrend">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<title>MealTrend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7; --card:#FFFFFF; --ink:#2A2118; --ink2:#6B6055; --line:#E3DED4;
    --chilli:#C8402F; --turmeric:#A6741A; --pandan:#3E7A4E; --deep:#1E4F45;
    --chilli-bg:#FBE9E6; --turmeric-bg:#F7EBD3; --pandan-bg:#E8F1E9; --deep-bg:#E2EDEA;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,sans-serif;
    font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  header{position:sticky;top:0;z-index:5;background:var(--paper);padding:16px 20px 12px;border-bottom:2px solid var(--ink)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
  .alertdot{background:var(--chilli);color:#fff;font-size:15px;font-weight:700;min-width:30px;height:30px;
    border-radius:15px;display:none;align-items:center;justify-content:center;padding:0 9px;
    text-decoration:none}
  .stamp{margin:6px 0 0;font-size:14px;color:var(--ink2);font-weight:500}
  .stamp b{color:var(--ink);font-weight:700}
  main{padding:22px 20px 110px;max-width:760px;margin:0 auto}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--ink);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
  nav a{flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none;
    padding:12px 4px;border-radius:8px;min-height:48px;display:flex;align-items:center;justify-content:center}
  nav a.on{color:var(--paper);background:var(--deep)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
  h2{font-size:23px;font-weight:800;margin:34px 0 10px;letter-spacing:-.015em;line-height:1.25}
  h2:first-child{margin-top:0}
  h3{font-size:19px;font-weight:700;margin:22px 0 8px;line-height:1.3}
  p{margin:0 0 14px}
  .sub{color:var(--ink2);font-size:16px}
  .nodata{color:var(--ink2);font-style:italic}
  .status{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:16px;padding:5px 12px;border-radius:20px;white-space:nowrap}
  .s-vlow{background:var(--deep-bg);color:var(--deep)}
  .s-low{background:var(--pandan-bg);color:var(--pandan)}
  .s-moderate{background:var(--turmeric-bg);color:var(--turmeric)}
  .s-high{background:var(--chilli-bg);color:var(--chilli)}
  .s-none{background:#EFEDE8;color:var(--ink2)}
  .answer{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:24px;margin-bottom:20px}
  .answer .big{font-size:40px;font-weight:800;line-height:1.08;letter-spacing:-.03em;margin:0 0 12px}
  .answer p{font-size:18px;margin:0;color:var(--ink2)}
  .answer p b{color:var(--ink)}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .fact .n{font-size:30px;font-weight:800;line-height:1;display:block;margin-bottom:6px;letter-spacing:-.02em}
  .fact .n.good{color:var(--pandan)} .fact .n.bad{color:var(--chilli)} .fact .n.mid{color:var(--turmeric)}
  .fact p{font-size:15px;color:var(--ink2);margin:0;line-height:1.35}
  button.fact{font:inherit;text-align:left;width:100%;cursor:pointer;
    border-color:var(--line);transition:border-color .15s}
  button.fact:hover:not(:disabled),button.fact:active:not(:disabled){border-color:var(--ink)}
  button.fact:disabled{cursor:default;opacity:1}
  .filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .filterbar span{font-weight:700;font-size:17px;flex:1}
  .filterbar .btn{margin:0}
  .alert .btn{margin:4px 0 10px}
  .meal{background:var(--card);border:1px solid var(--line);border-left-width:10px;border-radius:12px;
    padding:16px 16px 16px 14px;margin-bottom:12px;cursor:pointer}
  .meal.e-vlow{border-left-color:var(--deep)} .meal.e-low{border-left-color:var(--pandan)}
  .meal.e-moderate{border-left-color:var(--turmeric)} .meal.e-high{border-left-color:var(--chilli)}
  .meal .title{font-size:19px;font-weight:700;line-height:1.3;margin:0 0 6px}
  .meal .when{font-size:15px;color:var(--ink2);margin:0 0 10px}
  .meal .note{font-size:16px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .meal .note.fromai{color:var(--pandan);font-weight:500}
  .meal img{width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:12px}
  .btn{display:inline-block;background:var(--card);border:2px solid var(--ink);border-radius:10px;
    padding:14px 20px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin:0 8px 10px 0;color:var(--ink);min-height:50px}
  .btn.primary{background:var(--deep);color:#fff;border-color:var(--deep)}
  .btn.warn{color:var(--chilli);border-color:var(--chilli)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;
    padding:12px 6px;border-radius:8px;cursor:pointer;color:var(--ink2);min-height:46px}
  .seg button.on{background:var(--deep);color:#fff}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 6px;margin-bottom:14px}
  .bars{display:flex;flex-direction:column}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) 96px;grid-template-areas:"label value" "track track";
    gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .bar:last-child{border-bottom:0}
  .bl{grid-area:label;font-size:16.5px;font-weight:600;line-height:1.3;min-width:0;overflow-wrap:anywhere}
  .bsub{display:block;font-size:13.5px;font-weight:400;color:var(--ink2)}
  .bv{grid-area:value;text-align:right;font-size:19px;font-weight:800;line-height:1.2;white-space:nowrap}
  .bc{display:block;font-size:12.5px;font-weight:400;color:var(--ink2)}
  .bt{grid-area:track;height:12px;background:#EFEDE8;border-radius:6px;overflow:hidden;margin-top:6px}
  .bt i{display:block;height:100%;border-radius:6px}
  @media (min-width:520px){
    .bar{grid-template-columns:minmax(0,1.1fr) minmax(120px,1.4fr) 100px;
      grid-template-areas:"label track value";align-items:center;gap:0 16px}
    .bt{margin-top:0}
  }
  .key{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;margin-top:12px}
  .key i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
  .lens{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
  .lens h3{margin-top:0}
  .from{font-size:14px;color:var(--ink2);margin:0 0 12px}
  .lens ul{margin:0;padding-left:22px;font-size:16.5px;color:var(--ink2)}
  .lens li{margin-bottom:9px}
  .tip{border-left:6px solid var(--line);padding:4px 0 4px 16px;margin-bottom:16px}
  .tip.good{border-left-color:var(--pandan)} .tip.bad{border-left-color:var(--chilli)}
  .tip b{font-size:18px;display:block;margin-bottom:4px}
  .tip p{font-size:16.5px;color:var(--ink2);margin:0 0 6px}
  .alert{border-radius:12px;padding:18px;margin-bottom:14px;border:2px solid}
  .alert.red{background:var(--chilli-bg);border-color:var(--chilli)}
  .alert.amber{background:var(--turmeric-bg);border-color:var(--turmeric)}
  .alert b{font-size:19px;display:block;margin-bottom:6px}
  .alert p{font-size:16.5px;margin:0 0 8px}
  .allclear{background:var(--pandan-bg);border:2px solid var(--pandan);border-radius:12px;padding:20px;color:var(--pandan);font-size:18px;font-weight:600}
  .food{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .food .name{font-size:18px;font-weight:700}
  .food .kind{font-size:14px;color:var(--ink2);font-weight:500}
  .food .vals{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:16px;margin:12px 0}
  .food .tags i{display:inline-block;font-style:normal;font-size:14px;background:#EFEDE8;padding:4px 10px;border-radius:14px;margin:0 6px 6px 0;color:var(--ink2)}
  .food .from{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
  .food .from em{color:var(--turmeric);font-style:normal}
  label{display:block;font-size:15px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
  input,select,textarea{width:100%;padding:14px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:17px;background:#fff;color:var(--ink);min-height:50px}
  textarea{min-height:80px}
  .hint{display:block;font-size:14px;color:var(--ink2);font-weight:400;margin-top:6px}
  .search{margin-bottom:14px}
  .checkline{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--ink);font-weight:600;margin:16px 0}
  .checkline input{width:26px;height:26px;min-height:0;margin:0;flex:0 0 26px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #modal{display:none;position:fixed;inset:0;background:rgba(42,33,24,.55);z-index:20;overflow:auto;padding:16px}
  #modal.open{display:block}
  .sheet{background:var(--paper);border-radius:16px;padding:22px;max-width:600px;margin:0 auto 40px}
  .sheet h2{margin-top:0}
  .hit{padding:14px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px}
  .hit span{font-size:14px;color:var(--ink2)}
  .picked{margin:12px 0}
  .tag{display:inline-block;background:#EFEDE8;border-radius:16px;padding:8px 14px;font-size:16px;margin:0 8px 8px 0}
  .tag b{margin-left:8px;cursor:pointer;color:var(--chilli);font-size:19px}
  .verdict{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;margin:18px 0}
  .verdict ul{margin:10px 0 0;padding-left:22px;color:var(--ink2);font-size:16px}
  .sheetbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .ai{background:var(--pandan-bg);border:2px solid var(--pandan);border-radius:12px;padding:20px;margin:16px 0}
  .ai.failed{background:var(--chilli-bg);border-color:var(--chilli)}
  .ai .who{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .ai .who b{font-size:19px}
  .ai .who span{font-size:14px;color:var(--ink2)}
  .ai .summary{font-size:18px;line-height:1.5;margin:0 0 14px}
  .ai .part{font-size:16.5px;margin:12px 0;padding-top:12px;border-top:1px solid var(--line)}
  .ai .part>b{display:block;margin-bottom:4px;font-size:16px}
  .ai .part ul{margin:6px 0 0;padding-left:22px;color:var(--ink2)}
  .ai .part li{margin-bottom:6px}
  .ai .part.ask{background:#fff;border:2px solid var(--turmeric);border-radius:10px;padding:14px}
  .ai .part.main{background:#fff;border:2px solid var(--deep);border-radius:10px;padding:14px}
  .ai .cites{display:block;font-size:13.5px;color:var(--ink2);margin-top:5px}
  .ai .disc{font-size:14px;color:var(--ink2);margin:16px 0 0;line-height:1.45}
  .ntab{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
  .ntab th{text-align:left;font-size:14px;color:var(--ink2);border-bottom:2px solid var(--line);padding:0 8px 8px 0;font-weight:600}
  .ntab td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .ntab tr.none td{color:var(--ink2);font-style:italic}
  .ntab tr.rownote td{font-size:14.5px;color:var(--turmeric);border-bottom:0;padding-top:0}
  .ntab a{color:var(--pandan);font-weight:600}
  .ntab .where{display:block;font-size:13.5px;color:var(--ink2);font-weight:400}
  .thumb{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin:12px 0}
  pre{white-space:pre-wrap;font-size:14px;background:#fff;padding:12px;border-radius:8px;font-family:ui-monospace,monospace;line-height:1.45}
  .srclist{font-size:14px;color:var(--ink2);padding-left:20px;line-height:1.65}
  a{color:var(--pandan)}
  @media (min-width:560px){ .facts{grid-template-columns:repeat(4,1fr)} }
  @media (prefers-reduced-motion:no-preference){
    .answer{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>MealTrend</h1><a class="alertdot" id="badge" href="#alerts" aria-label="Red warnings"></a></div>
  <p class="stamp">Version <b id="ver"></b></p>
</header>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="modal"></div>
<script>
// ============================================================
// FOOD LIBRARY — single source of truth
// Every figure carries: value, band, source, confidence (0–100, subjective calibration)
// null = not measured / not available. Never estimated.
// ============================================================

const SRC = {
  KANEKO: "Kaneko K, Aoyagi Y, Fukuuchi T, Inazawa K, Yamaoka N. Biol Pharm Bull 2014;37(5):709–721 (HPLC, 270 foods) — read via secondary tabulation",
  HENRY:  "Henry CJ, Quek RYC, Kaur B, Shyam S, Gilcharan Singh HK. Nutr Diabetes 2021;11:2 — Table 1 read directly",
  SUN:    "Sun L, Lee DEM, Tan WJK, Ranawana DV, Quek YCR, Goh HJ, Henry CJ. Br J Nutr 2015;113(5):843–848",
  CHIA:   "Chia M. J Obes Wt Loss Ther 2012;S2:001 (OMICS supplement; n=11 athletes) — quality concern",
  ATK:    "Atkinson FS, Brand-Miller JC, Foster-Powell K, Buyken AE, Goletzke J. Am J Clin Nutr 2021;114(5):1625–32",
  HPB:    "HealthHub / Health Promotion Board Singapore, GI values of common foods, reviewed 26 Jun 2025",
  USDA:   "USDA FoodData Central, via Wikipedia sourced infobox",
  USDA2:  "USDA FoodData Central averages, via secondary chart (chartfarosh.com)",
  PANEL:  "Manufacturer nutrition panel, photographed",
  LABEL:  "Product label (Heineken / San Miguel / Peroni), via steadydrinker.com",
  BJN_BEER:"Br J Nutr (Cambridge), Netherlands beer study co-authored by Atkinson & Brand-Miller — pilsner, GI 89±5",
  WINE:   "Synthesised range: wine.com, Wine Insiders, Japan Standard Tables via fusubon.com",
  MY:     "Malaysian study in Henry 2021 compendium (T2DM participants where noted)",
  SGCAL:  "SingaporeCalorie.com — aggregator estimate, methodology undisclosed",
  SNAPCAL:"SnapCalorie.com — aggregator estimate, methodology undisclosed",
  VENTRICKLE:"Ventrickle × Munchi Pancakes, vendor-collaborated slice analysis (2024)",
  SHF:    "Singapore Heart Foundation 'Hearty' recipe — a MODIFIED healthier version, not a standard hawker product",
  USDA_SAT:"USDA FoodData Central saturated fat values, via FoodStruct/Wikipedia sourced infoboxes",
  FSA:    "UK Food Standards Agency front-of-pack thresholds: sugar ≤5 low, 5–22.5 medium, >22.5 high per 100g"
};

// Purine bands (Kaneko / Japanese guideline): vlow <50, low 50–100, mod 100–200, high 200–300, vhigh >300
function pBand(v){ if(v==null) return null; if(v<50) return "vlow"; if(v<100) return "low"; if(v<200) return "mod"; if(v<300) return "high"; return "vhigh"; }
// GI bands (Sydney / HPB): low ≤55, med 56–69, high ≥70
function gBand(v){ if(v==null) return null; if(v<=55) return "low"; if(v<=69) return "med"; return "high"; }
// Sugar bands (FSA)
function sBand(v){ if(v==null) return null; if(v<=5) return "low"; if(v<=22.5) return "med"; return "high"; }
// Saturated fat bands, UK FSA front-of-pack thresholds for solid foods:
// low <=1.5 g, medium 1.5-5 g, high >5 g per 100 g.
function satBand(v){ if(v==null) return null; if(v<=1.5) return "low"; if(v<=5) return "med"; return "high"; }

// flags: dried_seafood (confirmed) | dried_seafood_likely (conventional, unconfirmed) | shellfish | organ | alcohol | sweetened | dairy | egg | plant_protein
const FOODS = [
  // ---------- PURINE-DEFINED PROTEINS & GARNISHES ----------
  { id:"ikan_bilis", name:"Ikan bilis, dried", cat:"dried seafood", flags:["dried_seafood"],
    purine:{v:1109, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null}, chol:{v:null} },
  { id:"hae_bee", name:"Hae bee, dried shrimp", cat:"dried seafood", flags:["dried_seafood","shellfish"],
    purine:{v:749, src:SRC.KANEKO+" — sakura shrimp, closest measured", conf:60}, gi:{v:null}, sugar:{v:null}, chol:{v:null} },
  { id:"katsuobushi", name:"Katsuobushi, dried", cat:"dried seafood", flags:["dried_seafood"],
    purine:{v:493, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null}, chol:{v:null} },
  { id:"dried_shiitake", name:"Dried shiitake", cat:"dried", flags:[],
    purine:{v:380, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null}, chol:{v:0, src:"plant food — no cholesterol", conf:95} },
  { id:"chicken_liver", name:"Chicken liver", cat:"organ", flags:["organ"],
    purine:{v:312, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null}, chol:{v:null, note:"highest of common foods per USDA; exact figure not retrieved"} },
  { id:"pork_liver", name:"Pork liver", cat:"organ", flags:["organ"],
    purine:{v:285, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null}, chol:{v:null} },
  { id:"shrimp_fresh", name:"Prawn, fresh", cat:"seafood", flags:["shellfish"],
    purine:{v:273, src:SRC.KANEKO+" — oriental shrimp; species range 53–273", conf:65}, gi:{v:null}, sugar:{v:null},
    chol:{v:130, src:SRC.USDA+" — raw mixed species; cooked 122–251", conf:75} },
  { id:"chicken_breast", name:"Chicken breast", cat:"poultry", flags:[],
    purine:{v:141, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null},
    chol:{v:86, src:SRC.USDA2+" — 73 mg/85g serving, converted", conf:60} },
  { id:"chicken_leg", name:"Chicken thigh", cat:"poultry", flags:[],
    purine:{v:123, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null},
    chol:{v:104, src:SRC.USDA2+" — 88 mg/85g serving, converted", conf:60} },
  { id:"salmon", name:"Salmon", cat:"fish", flags:[],
    purine:{v:119, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null},
    chol:{v:55, src:SRC.USDA+" — wild Atlantic, raw", conf:80} },
  { id:"tuna", name:"Tuna", cat:"fish", flags:[],
    purine:{v:157, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null},
    chol:{v:24, src:SRC.USDA2+" — ~20 mg/85g, converted", conf:55} },
  { id:"pork_shoulder", name:"Pork shoulder", cat:"pork", flags:[],
    purine:{v:81, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null}, chol:{v:null, note:"USDA value not retrieved this session"} },
  { id:"pork_ribs", name:"Pork ribs", cat:"pork", flags:[],
    purine:{v:76, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null}, chol:{v:null, note:"USDA value not retrieved this session"} },
  { id:"pork_neck", name:"Pork neck", cat:"pork", flags:[],
    purine:{v:71, src:SRC.KANEKO, conf:80}, gi:{v:null}, sugar:{v:null}, chol:{v:null} },
  { id:"pork_lard", name:"Pork lard", cat:"fat", flags:[],
    purine:{v:null, note:"rendered fat — purines sit in protein-rich tissue; not measured"}, gi:{v:null}, sugar:{v:null}, chol:{v:null, note:"not retrieved"} },
  { id:"fish_paste", name:"Fish paste", cat:"fish", flags:[],
    purine:{v:68, src:SRC.KANEKO+" — fish ball, proxy", conf:65}, gi:{v:null}, sugar:{v:null}, chol:{v:null} },
  { id:"egg", base:"egg", variant:"whole", name:"Egg, whole", cat:"egg", flags:["egg"],
    purine:{v:0, src:SRC.KANEKO, conf:90}, gi:{v:null}, sugar:{v:null},
    chol:{v:null, note:"yolk 1085 mg/100g confirmed (USDA); whole-egg figure not confirmed this session"} },
  { id:"egg_yolk", base:"egg", variant:"yolk", name:"Egg, yolk only", cat:"egg", flags:["egg"],

    note:"Checked: vegetable curry, no added sugar in drink. Curries dipped, not drunk." },
  { seq:19, date:null, slot:"dinner",    label:"Grilled salmon, soup, asparagus", items:["salmon","asparagus","pork_ribs","clear_pork_stock","potato","carrot"], liquid:"clear", checked:false, rating:"low",
    note:"Broth meal rated Low — no starch, light stock" },
  { seq:20, date:null, slot:"breakfast", label:"Snowskin mooncake + mango", items:["snowskin","mango"], liquid:"none", checked:false, rating:"vlow", note:"31g sugar/100g on pack" },

  { seq:22, date:null, slot:"dinner",    label:"Sweet-and-sour pork, long beans with egg, pork rib soup", items:["pork_shoulder","sweet_sour_sauce","onion","long_beans","egg","pork_ribs","clear_pork_stock","red_dates","corn","carrot"], liquid:"clear", checked:true, rating:"low",
    note:"Checked: pork only, no conpoy. Third broth meal rated Low." },
  { seq:23, date:null, slot:"lunch",     label:"Dry bee hoon with pork lard and vegetables", items:["bee_hoon","pork_lard","bean_sprouts","leafy_greens"], liquid:"none", checked:false, rating:"low",
