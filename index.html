</script>
<script>
// ============================================================
// MEALTREND — app logic
// Version stamp convention: vYYYY:MMM:DD-HH:MM (Asia/Singapore)
// ============================================================
const VERSION = "v2026:SEP:08-05:20"; // HH:MM approximate — device clock unavailable; set on first edit

const LS_KEY = "mealtrend.v1";
const BANDS = {
  purine: { vlow:{l:"Very little",c:"#1E4F45"}, low:{l:"A little",c:"#3E7A4E"}, mod:{l:"Some",c:"#A6741A"}, high:{l:"A lot",c:"#C8402F"}, vhigh:{l:"A huge amount",c:"#8E2A1E"} },
  gi:     { low:{l:"Slow",c:"#3E7A4E"}, med:{l:"Medium",c:"#A6741A"}, high:{l:"Fast",c:"#C8402F"} },
  sugar:  { low:{l:"Low",c:"#3E7A4E"}, med:{l:"Medium",c:"#A6741A"}, high:{l:"High",c:"#C8402F"} },
  satfat: { low:{l:"Low",c:"#3E7A4E"}, med:{l:"Medium",c:"#A6741A"}, high:{l:"High",c:"#C8402F"} },
  rating: { vlow:{l:"Very safe",c:"#1E4F45"}, low:{l:"Fine",c:"#3E7A4E"}, moderate:{l:"Watch this",c:"#A6741A"}, high:{l:"Be careful",c:"#C8402F"} }
};
const RANK = { vlow:0, low:1, moderate:2, mod:2, high:3, vhigh:4 };
const FOOD = Object.fromEntries(FOODS.map(f=>[f.id,f]));

// ---------- STORE ----------
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.meals) return s; }catch(e){}
  return { meals: SEED_MEALS.map(m=>({...m, id:"seed"+m.seq, source:"conversation log"})), settings:{} };
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
let STATE = load();

// ---------- RATING ENGINE (for new meals; seeded meals keep logged rating) ----------
function rateMeal(m){
  const items = m.items.map(id=>FOOD[id]).filter(Boolean);
  const flags = new Set(items.flatMap(f=>f.flags||[]));
  let rank = 0; const why=[];
  items.forEach(f=>{ if(f.purine.band){ rank=Math.max(rank,RANK[f.purine.band]); } });
  const top=items.filter(f=>f.purine.band && RANK[f.purine.band]===rank).map(f=>f.name).slice(0,2).join(", ");
  if(rank>=3) why.push(`${top} is very high in purine`);
  else if(rank===2) why.push(`${top} has a fair amount of purine`);
  if(flags.has("dried_seafood")){ rank=Math.max(rank,3); why.push("Dried seafood is here. Drying removes water, so the purine gets packed tight."); }
  else if(flags.has("dried_seafood_likely")){ rank=Math.max(rank,2); why.push("Gravies like this usually use dried shrimp, but nobody has confirmed it. Ask the stall."); }
  if(flags.has("organ")){ rank=Math.max(rank,3); why.push("Organ meat is very high in purine."); }
  if(m.liquid==="gravy"||m.liquid==="concentrated"){ rank=Math.max(rank,2); why.push("You drank a thick gravy. Purine dissolves in water, so it ends up in the liquid."); }
  else if(m.liquid==="clear"){ why.push("Clear soup only. Less gets pulled into the liquid, so the food itself decides the score."); }
  else if(!flags.has("dried_seafood")){ if(rank<3){ rank=Math.min(rank,1); } why.push("Cooked dry, no dried seafood. Nothing leaked into a liquid you drank."); }
  const plantOrZero = items.length && items.every(f=>f.purine.v===0 || (f.purine.v!=null && f.purine.v<50) || (f.purine.v==null && ["fruit","vegetable","drink","cake","dessert","cereal","fat","sauce","curry"].includes(f.cat)));
  if(plantOrZero && m.liquid==="none" && !flags.has("dried_seafood")) return {rating:"vlow", why:["Nothing here is a real purine source, and there is no soup or gravy."]};
  rank=Math.min(rank,3);
  const map=["vlow","low","moderate","high"];
  return { rating: map[Math.max(rank,1)], why };
}

// ---------- ANALYSIS ----------
function analyse(meals){
  const n = meals.length;
  const byRating = {vlow:0,low:0,moderate:0,high:0};
  meals.forEach(m=>byRating[m.rating]++);
  const liquid = meals.filter(m=>m.liquid!=="none");
  const dry = meals.filter(m=>m.liquid==="none");
  const liquidElevated = liquid.filter(m=>RANK[m.rating]>=2).length;
  const dryLow = dry.filter(m=>RANK[m.rating]<=1).length;
  const dryNoSea = dry.filter(m=>!m.items.some(id=>FOOD[id]?.flags?.includes("dried_seafood")));
  const dryNoSeaLow = dryNoSea.filter(m=>RANK[m.rating]<=1).length;
  const flagCount = {};
  const catCount = {};
  meals.forEach(m=>m.items.forEach(id=>{ const f=FOOD[id]; if(!f) return; (f.flags||[]).forEach(fl=>flagCount[fl]=(flagCount[fl]||0)+1); catCount[f.cat]=(catCount[f.cat]||0)+1; }));
  const gravy = meals.filter(m=>m.liquid==="gravy").length;
  const clear = meals.filter(m=>m.liquid==="clear").length;
  const checked = meals.filter(m=>m.checked).length;
  const highGI = meals.filter(m=>m.items.some(id=>FOOD[id]?.gi?.band==="high")).length;
  const starch = meals.filter(m=>m.items.some(id=>["rice","rice dish","noodle","noodle dish","bread","bun","cake","snack"].includes(FOOD[id]?.cat))).length;
  const sweet = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("sweetened"))).length;
  const dairy = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("dairy"))).length;
  const egg = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("egg"))).length;
  const plant = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("plant_protein"))).length;
  const satHigh = meals.filter(m=>m.items.some(id=>FOOD[id]?.satfat?.band==="high")).length;
  const coconut = meals.filter(m=>m.items.some(id=>["coconut_milk","laksa_gravy","nasi_lemak","curry_gravy_chicken"].includes(id))).length;
  const driedSea = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("dried_seafood"))).length;
  const alcohol = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("alcohol"))).length;
  const organ = meals.filter(m=>m.items.some(id=>FOOD[id]?.flags?.includes("organ"))).length;
  return { n, byRating, liquid:liquid.length, dry:dry.length, liquidElevated, dryLow, dryNoSea:dryNoSea.length, dryNoSeaLow, satHigh, coconut, gravy, clear, checked, highGI, starch, sweet, dairy, egg, plant, driedSea, alcohol, organ, catCount };
}

// ---------- ALERTS ----------
// Works on dates if present, otherwise treats consecutive sequence entries as adjacent days.
function windowOf(meals, i, days){
  const m = meals[i];
  if(m.date){ const t=new Date(m.date).getTime(); return meals.filter(x=>x.date && Math.abs(new Date(x.date).getTime()-t) <= days*86400000); }
  // no date: only meals explicitly linked as same-day count
  const linked = meals.filter(x=>x.sameDayAs===m.seq || m.sameDayAs===x.seq || (x.sameDayAs && x.sameDayAs===m.sameDayAs));
  return [m, ...linked.filter(x=>x!==m)];
}
function alerts(meals){
  const out=[];
  const sorted=[...meals].sort((a,b)=>(a.seq||0)-(b.seq||0));
  const has=(m,fl)=>m.items.some(id=>FOOD[id]?.flags?.includes(fl));
  sorted.forEach((m,i)=>{
    const w1 = windowOf(sorted,i,1), w2 = windowOf(sorted,i,2);
    const dried = w1.filter(x=>has(x,"dried_seafood")).length;
    if(dried>=2 && has(m,"dried_seafood")) out.push({lvl:"red", seq:m.seq, t:"Two dried-seafood meals within a day", d:"This is the exact pattern of the flare day (meals 1 and 2). Dried anchovy is 1,109 mg/100g — roughly 36 g reaches the 400 mg daily ceiling alone.", src:GUIDE.purine_window_days.src});
    if(has(m,"organ")) out.push({lvl:"red", seq:m.seq, t:"Organ meat", d:"Liver 285–312 mg/100g, high band. ACR 2020 conditionally recommends limiting.", src:"ACR 2020 gout guideline"});
    const conc = w2.filter(x=>x.liquid==="gravy"||x.liquid==="concentrated").length;
    if(conc>=2 && (m.liquid==="gravy"||m.liquid==="concentrated")) out.push({lvl:"amber", seq:m.seq, t:"Two concentrated gravies within 48 hours", d:"The 2-day intake window is what predicted recurrent flares in Zhang 2012 (top quintile OR 4.76). Leave a third of the gravy.", src:GUIDE.purine_window_days.src});
    const satHi = w1.filter(x=>x.items.some(id=>FOOD[id]?.satfat?.band==="high")).length;
    if(satHi>=2 && m.items.some(id=>FOOD[id]?.satfat?.band==="high")) out.push({lvl:"amber", seq:m.seq, t:"Two high saturated-fat meals in one day", d:"Coconut milk is 19 g of saturated fat per 100 g. Pork lard is 39 g. A day's target is about 22 g in total. This is the fat that raises the cholesterol that clogs arteries.", src:GUIDE.satfat_g.src});
    if(has(m,"alcohol")) out.push({lvl:"amber", seq:m.seq, t:"Alcohol", d:"Beer had the strongest gout association of any beverage in Choi 2004 — despite near-zero sugar. Mechanism is ethanol, not purine.", src:GUIDE.alcohol.src});
    const sw = w1.filter(x=>has(x,"sweetened")).length;
    if(sw>=2 && has(m,"sweetened")) out.push({lvl:"amber", seq:m.seq, t:"Two sweetened items within a day", d:"WHO: free sugars <10% energy (≈50 g), ideally <5% (≈25 g). Only two items in the library carry a measured sugar figure — this alert counts flags, not grams.", src:GUIDE.free_sugar_g.src});
    const hg = w1.filter(x=>x.items.some(id=>FOOD[id]?.gi?.band==="high")).length;
    if(hg>=2 && m.items.some(id=>FOOD[id]?.gi?.band==="high")) out.push({lvl:"amber", seq:m.seq, t:"Two high-GI starch meals within a day", d:"Pattern flag, not a guideline threshold — no daily GI limit exists. Composition lowers it: rice 96 → 50 with oil, protein and vegetables in the same study.", src:GUIDE.gi_daily.src});
  });
  // dedupe by seq+title
  const seen=new Set(); return out.filter(a=>{const k=a.seq+a.t; if(seen.has(k)) return false; seen.add(k); return true;});
}

// ---------- RECOMMENDATIONS (rule-based, computed from the log) ----------
function recommend(A){
  const more=[], less=[];
  const pct=x=>Math.round(100*x/A.n);
  // MORE
  more.push({t:"Eggs and milk", d:`Eggs have zero purine. So does milk, and a big study found milk drinkers got gout less often. You already have eggs in ${A.egg} meals and milk in ${A.dairy}.`, src:"Kaneko 2014; Choi NEJM 2004"});
  more.push({t:"Grilled, fried and stir-fried food", d:`${A.dryNoSeaLow} of your ${A.dryNoSea} dry-cooked meals without dried seafood came out fine. Nothing leaks into a liquid you drink.`, src:"Your own meal log"});
  more.push({t:"Tofu, tempeh and bee hoon", d:`Purine from plants causes far fewer gout attacks than purine from meat. And bee hoon raises blood sugar slower than any other Singapore food tested.`, src:"Zhang 2012; Sun 2015"});
  more.push({t:"Never eat rice on its own", d:"In one study plain rice scored 96 for blood sugar speed. The same rice with oil, chicken and vegetables scored 50. Almost half. Your chicken and tempeh plate already does this.", src:"Henry 2021, Singapore rice study"});
  more.push({t:"Drinks without sugar", d:`You have already picked these three times. Sugar in drinks pushes up uric acid. No sugar means that problem disappears.`, src:"ACR 2020 gout guideline"});
  // LESS
  if(A.driedSea) less.push({t:"Ikan bilis and other dried seafood", d:`${A.driedSea} of your meals had it. Ikan bilis has nine times the purine of chicken. Skip the sprinkle on top. Keep the rice and the chicken.`, src:"Kaneko 2014"});
  if(A.gravy) less.push({t:"Thick gravy you drink", d:`${A.gravy} meals, which is ${pct(A.gravy)}% of everything. Leave a third of the gravy in the bowl. The tofu, greens and noodles were fine every single time. It is the liquid.`, src:"Your own meal log"});
  less.push({t:"Prawns in prawn gravy with fried bun", d:"Three problems in one dish. The prawn itself, the gravy made from prawn shells, and a fried bun that soaks the gravy up. Eat the prawn, skip the bun.", src:"Kaneko 2014"});
  if(A.sweet) less.push({t:"Sweet sauces and dips", d:`${A.sweet} of your meals had something sweet in the sauce. Mee siam, sweet and sour, sambal, chilli prawn. Only the mooncake has a real sugar number on the packet.`, src:"WHO 2015 sugar guideline"});
  if(A.satHigh) less.push({t:"Coconut gravy and pork lard", d:`${A.satHigh} of your meals had a food that is high in saturated fat. Coconut milk is 19 g per 100 g. Pork lard is 39 g. Your whole day should stay under about 22 g. This is the fat that clogs arteries, and it matters more for your heart than cholesterol in food does.`, src:"WHO and AHA saturated fat guidance"});
  less.push({t:"Two risky meals in one day", d:"Your sore toe came after two ikan bilis meals hours apart. What matters is the whole two days, not one plate. Spread the risky ones out.", src:"Zhang 2012"});
  return {more, less};
}

// ---------- SVG CHART HELPERS ----------
const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:'Public Sans',sans-serif">${inner}</svg>`;
function hbars(rows, opts={}){
  // HTML rows, not SVG: labels wrap instead of colliding, bars scale with the screen.
  const maxV=opts.max||Math.max(...rows.map(r=>r.v||0),1);
  const log=!!opts.log;
  const w=v=>{ if(v==null||v<=0) return 0.6;
    const p = log ? Math.log10(v+1)/Math.log10(maxV+1) : v/maxV;
    return Math.max(0.6, p*100); };
  return `<div class="bars">${rows.map(r=>`
    <div class="bar">
      <div class="bl">${esc(r.label)}${r.sub?`<span class="bsub">${esc(r.sub)}</span>`:""}</div>
      <div class="bt"><i style="width:${w(r.v).toFixed(1)}%;background:${r.color}"></i></div>
      <div class="bv">${r.v==null?"—":r.v}${r.conf!=null?`<span class="bc">${r.conf}% sure</span>`:""}</div>
    </div>`).join("")}</div>`;
}
function stackedSeq(meals){ // rating over sequence
  const W=360,H=150,pad=6; const n=meals.length; const bw=(W-pad*2)/n;
  let s=`<line x1="${pad}" y1="${H-20}" x2="${W-pad}" y2="${H-20}" stroke="#E3DED4"/>`;
  meals.forEach((m,i)=>{ const h=(RANK[m.rating]+1)*26; const c=BANDS.rating[m.rating].c;
    s+=`<rect x="${pad+i*bw+1}" y="${H-20-h}" width="${Math.max(2,bw-2)}" height="${h}" fill="${c}" rx="1"><title>#${m.seq} ${esc(m.label)} — ${BANDS.rating[m.rating].l}</title></rect>`;
    if(m.liquid!=="none") s+=`<circle cx="${pad+i*bw+bw/2}" cy="${H-9}" r="3.5" fill="${m.liquid==="clear"?"#A6741A":"#C8402F"}"/>`;
  });
  return svg(W,H,s);
}
function donut(parts){ // [{v,color,label}]
  const total=parts.reduce((a,p)=>a+p.v,0)||1; const R=44, r=28, cx=60, cy=60; let a0=-Math.PI/2; let s="";
  parts.forEach(p=>{ const a1=a0+2*Math.PI*p.v/total; const large=(a1-a0)>Math.PI?1:0;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const xi0=cx+r*Math.cos(a1),yi0=cy+r*Math.sin(a1),xi1=cx+r*Math.cos(a0),yi1=cy+r*Math.sin(a0);
    if(p.v>0) s+=`<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${xi0},${yi0} A${r},${r} 0 ${large} 0 ${xi1},${yi1} Z" fill="${p.color}"><title>${esc(p.label)}: ${p.v}</title></path>`;
    a0=a1; });
  return svg(120,120,s);
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- VIEWS ----------
const $=s=>document.querySelector(s);
function chip(band,kind){ const b=BANDS[kind]&&BANDS[kind][band];
  if(!b) return `<span class="status s-none">No data</span>`;
  const cls = kind==="rating" ? "s-"+band : (RANK[band]>=3?"s-high":RANK[band]>=2?"s-moderate":RANK[band]>=1?"s-low":"s-vlow");
  const cls2 = (kind==="gi"||kind==="sugar"||kind==="satfat")
             ? (band==="high"?"s-high":band==="med"?"s-moderate":"s-low") : cls;
  return `<span class="status ${cls2}">${b.l}</span>`; }
function val(x,unit=""){ return x==null?`<span class="nodata">No data</span>`:`<b>${x}${unit}</b>`; }

function viewDashboard(){
  const A=analyse(STATE.meals); const al=alerts(STATE.meals);
  const reds=al.filter(a=>a.lvl==="red").length, ambers=al.filter(a=>a.lvl==="amber").length;
  const okPct=Math.round(100*(A.byRating.vlow+A.byRating.low)/Math.max(1,A.n));
  const head = reds ? "Something needs your attention"
             : okPct>=70 ? "Most of your meals look fine"
             : "A few meals need watching";
  return `
  <div class="answer">
    <p class="big">${head}</p>
    <p><b>${okPct}%</b> of your ${A.n} meals came out fine or very safe. ${reds?`<b>${reds}</b> ${reds===1?"meal needs":"meals need"} a closer look.`:"Nothing is flagged red right now."}</p>
  </div>
  <div class="facts">
    <button class="fact tap" onclick="goMeals('dry')"><span class="n good">${A.dryNoSeaLow}/${A.dryNoSea}</span><p>Meals cooked dry, with no dried seafood, that came out fine — tap to see them</p></button>
    <button class="fact tap" onclick="goMeals('liquid')"><span class="n bad">${A.liquidElevated}/${A.liquid}</span><p>Soup or gravy meals that needed watching — tap to see them</p></button>
    <button class="fact tap" onclick="goAlerts('red')" ${reds?'':'disabled'}><span class="n ${reds?'bad':'good'}">${reds}</span><p>Red warnings${reds?' — tap to read them':''}</p></button>
    <button class="fact tap" onclick="goAlerts('amber')" ${ambers?'':'disabled'}><span class="n ${ambers?'mid':'good'}">${ambers}</span><p>Orange warnings${ambers?' — tap to read them':''}</p></button>
  </div>
  <h2>Your meals over time</h2>
  <p class="sub">Each bar is one meal. Taller and redder means more purine. A dot underneath means you drank soup or gravy with it.</p>
  <div class="chart">${stackedSeq([...STATE.meals].sort((a,b)=>a.seq-b.seq))}
    <div class="key">${Object.entries(A.byRating).map(([k,v])=>`<span><i style="background:${BANDS.rating[k].c}"></i>${BANDS.rating[k].l} — ${v}</span>`).join("")}</div>
  </div>
  <h2>What the log shows</h2>
  <p>When you cook food dry and skip dried seafood, it comes out fine almost every time — <b>${A.dryNoSeaLow} out of ${A.dryNoSea}</b>. The one dry meal that scored badly was nasi lemak, and that was the ikan bilis on top, not the cooking.</p>
  <p>Soup and gravy meals are the opposite: <b>${A.liquidElevated} of ${A.liquid}</b> needed watching. But not all of them. Thin clear soup with one piece of low-purine meat scored fine. Thick rempah gravy did not. <b>How strong the liquid is matters more than whether it is a liquid.</b></p>
  <p class="sub">Older meals keep the score I gave them during our conversation. Open any meal to see what the app would score it now — a few early clear soups were marked stricter than they should have been.</p>`;
}

function viewLog(){
  let meals=[...STATE.meals].sort((a,b)=>b.seq-a.seq);
  const hasSea=m=>m.items.some(id=>FOOD[id]?.flags?.includes("dried_seafood"));
  let banner="";
  if(MEALFILTER==="dry"){ meals=meals.filter(m=>m.liquid==="none"&&!hasSea(m)); banner="Cooked dry, no dried seafood"; }
  if(MEALFILTER==="liquid"){ meals=meals.filter(m=>m.liquid!=="none"&&RANK[m.rating]>=2); banner="Soup or gravy meals that needed watching"; }
  const head = MEALFILTER==="all"
    ? `<button class="btn primary" onclick="openAdd()">Add a meal</button>`
    : `<div class="filterbar"><span>${banner} — ${meals.length} ${meals.length===1?"meal":"meals"}</span><button class="btn" onclick="MEALFILTER='all';route()">Show all</button></div>`;
  return head+`<div>${meals.map(m=>`<div class="meal e-${m.rating}" onclick="openMeal('${m.id}')">
    <p class="title">${esc(m.label)}</p>
    <p class="when">${m.date||'Date not recorded'} · ${m.slot}${m.liquid!=="none"?` · you drank the ${m.liquid==="gravy"?"gravy":"soup"}`:""}${m.checked?` · you checked the ingredients`:""}</p>
    ${chip(m.rating,'rating')}
    ${m.note?`<p class="note">${esc(m.note)}</p>`:''}
    ${m.ai&&!m.ai.error?`<p class="note fromai">${esc(m.ai.overall||"")}</p>`:''}
    ${m.thumb?`<img src="data:image/jpeg;base64,${m.thumb}" alt="">`:''}
  </div>`).join("")}</div>`;
}

function viewRankings(kind){
  const eaten=new Set(STATE.meals.flatMap(m=>m.items));
  const key=kind;
  const bandKind={purine:"purine",gi:"gi",sugar:"sugar",satfat:"satfat",chol:null}[kind];
  let rows=FOODS.filter(f=>eaten.has(f.id)).map(f=>({f, v:f[key].v, band:f[key].band, conf:f[key].conf, src:f[key].src, note:f[key].note}));

  // Collapse variants of one food when this axis gives them the SAME number.
  // Different numbers (bee hoon plain 35 vs fried 45 on GI) stay as separate rows.
  const groups={};
  rows.forEach(r=>{ const k=r.f.base?`${r.f.base}|${r.v}`:`solo|${r.f.id}`; (groups[k]=groups[k]||[]).push(r); });
  rows=Object.values(groups).map(g=>{
    if(g.length===1) return g[0];
    const base=g[0].f.base;
    const nice={bee_hoon:"Bee hoon",tofu:"Tofu and tau pok",egg:"Egg",sourdough:"Sourdough",wine:"Wine"}[base]||g[0].f.name;
    return {...g[0], label:nice, sub:g.map(x=>x.f.variant).join(" and "), merged:g.length};
  });

  const withV=rows.filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
  const noV=rows.filter(r=>r.v==null);
  const colorFor=r=>{ if(kind==="chol") return r.v>=300?"#C8402F":r.v>=100?"#A6741A":"#3E7A4E";
    return (BANDS[bandKind][r.band]||{c:"#6B6055"}).c; };
  const title={purine:"Purine in the foods you eat",gi:"How fast these foods raise blood sugar",sugar:"Sugar in the foods you eat",satfat:"Saturated fat in the foods you eat",chol:"Cholesterol in the foods you eat"}[kind];
  const note={
    purine:"Purine is a chemical in food. Your body turns it into uric acid. Too much uric acid can cause gout. Numbers are milligrams per 100 grams of food. <b>The bars use a squashed scale</b> — ikan bilis is so far ahead that on a normal scale everything else would be an invisible sliver. Read the numbers, not just the bar lengths.",
    gi:"Glycemic index means how fast a food pushes up your blood sugar. Under 55 is slow. 56 to 69 is medium. 70 and above is fast. Slower is easier on your body.",
    sugar:"Grams of sugar per 100 grams of food. Under 5 is low. Over 22.5 is high. These are the UK food label limits.",
    satfat:"Grams of saturated fat per 100 grams. This is the fat that raises your LDL cholesterol, the kind that clogs arteries. <b>1.5 g or less per 100 g is low. Over 5 g is high.</b> Those are the UK food label limits. A rough daily target is about 22 grams. <b>Only 8 foods here have a real measured number</b> — most Singapore dishes have never been tested for this.",
    chol:"Milligrams of cholesterol per 100 grams. <b>There is no daily limit any more</b> — the old 300 mg rule was dropped in 2015. This list is for comparing foods, not for worrying. Saturated fat matters more for your heart, and this app does not track that yet."
  }[kind];
  const merged=withV.filter(r=>r.merged).length;
  return `<h2>${title}</h2><p class="sub">${note}</p>
  ${merged?`<p class="sub">${merged} ${merged===1?"row shows":"rows show"} two versions of one food together, because they have the same number here.</p>`:""}
  ${withV.length?`<div class="chart">`+hbars(withV.map(r=>({label:r.label||r.f.name, sub:r.sub, v:r.v, color:colorFor(r), conf:r.conf})),{log:kind==="purine"})+`</div>`:'<p class="nodata">None of the foods you have eaten have a measured number for this.</p>'}
  ${noV.length?`<h3>No number available for these</h3><ul class="srclist">${noV.map(r=>`<li><b>${esc(r.label||r.f.name)}</b>${r.note?` — ${esc(r.note)}`:''}</li>`).join("")}</ul>`:''}
  <h3>Where these numbers come from</h3><ul class="srclist">${[...new Set(withV.map(r=>r.src).filter(Boolean))].map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
}

function viewLenses(){
  const A=analyse(STATE.meals); const R=recommend(A);
  const lens=(name,basis,body)=>`<div class="lens"><h3>${name}</h3><p class="from">Based on: ${basis}</p>${body}</div>`;
  return `<h2>Ask the AI dietitian about everything you have eaten</h2>
  <button class="btn primary" onclick="runLogAI()" ${AI.ready()?"":"disabled title='Add API key under More → AI'"}>${STATE.review?"Look again":"Review my meals"}</button>
  <div id="reviewBox">${renderReview(STATE.review)}</div>
  <h2>What the health guidelines say</h2>
  <p class="sub">These are rules written down from published health guidelines. No doctor or dietitian looked at your case. Nothing here was measured on your body.</p>
  ${lens("Gout and uric acid", "ACR 2020 guideline; Zhang 2012; Choi 2004; Kaneko 2014 purine table",
    `<ul><li>Purine is a chemical in food. Your body turns it into uric acid. Too much uric acid can form crystals in a joint, and that is gout.</li>
    <li>Dried seafood showed up in ${A.driedSea} of your ${A.n} meals. It is by far the strongest purine source you eat.</li>
    <li>You drank thick gravy in ${A.gravy} meals and clear soup in ${A.clear}. Of all ${A.liquid} liquid meals, ${A.liquidElevated} needed watching.</li>
    <li>No alcohol and no organ meat anywhere in your log. Those are two of the biggest gout triggers, and you avoid both already.</li>
    <li>Milk appeared in ${A.dairy} meals. People who drink more milk get gout less often.</li>
    <li>Food only moves your uric acid a small amount. Your genes and your kidneys do most of the work. <b>A blood test would tell you more than this whole app.</b></li></ul>`)}
  ${lens("Blood sugar", "Singapore HPB glycemic index list, 2025; Henry 2021; Atkinson 2021",
    `<ul><li>Glycemic index means how fast a food pushes your blood sugar up. Slow is better.</li>
    <li>${A.highGI} of your ${A.n} meals had a fast-acting starch. ${A.starch} had starch of some kind.</li>
    <li>What you eat <i>with</i> the rice matters more than swapping the rice. Plain rice scored 96. The same rice with oil, chicken and vegetables scored 50.</li>
    <li>Bee hoon is the slowest staple you eat, at 35. Nasi lemak is the fastest, at 70 to 100.</li>
    <li>There is no daily limit for glycemic index in any guideline. These are patterns, not rules.</li></ul>`)}
  ${lens("Heart and cholesterol", "US Dietary Guidelines 2015-2020 and 2020-2025; AHA 2019; WHO saturated fat guidance",
    `<ul><li><b>Saturated fat is the one that matters for your heart.</b> It raises LDL, the cholesterol that clogs arteries. Aim for under about 22 grams a day.</li>
    <li>Coconut milk is 19 g per 100 g, and ${A.coconut} of your meals had a coconut gravy or coconut rice. Pork lard is 39 g per 100 g. Those two are your main sources.</li>
    <li><b>Cholesterol in food is a different thing, and the old 300 mg daily limit was dropped in 2015.</b> There is no daily limit now. That is why this app never sounds an alarm about it.</li>
    <li>Only 8 foods in this app have a real saturated fat number. Most hawker dishes have never been measured. The AI can look one up for you when you analyse a meal.</li>
    <li>Egg yolk looks alarming at 1,085 mg cholesterol per 100 g, but one yolk weighs about 17 g. Four eggs is four yolks. It is also the only food where cholesterol and purine point in opposite directions.</li></ul>`)}
  ${lens("Eating at hawker centres", "Singapore HPB; Henry 2021 Singapore and Malaysia studies",
    `<ul><li>You asked the cook or stall what went in ${A.checked} times. Every single time the answer made the meal <i>safer</i> than assumed. Keep asking.</li>
    <li>Gravies are the big unknown. Dried shrimp is normal in rempah, but nobody has confirmed it in your ${A.gravy} gravy meals.</li>
    <li>Order yong tau fu in clear soup instead of laksa gravy. Same tofu, same vegetables, much lighter liquid.</li></ul>`)}
  <h2>Eat more of this</h2>${R.more.map(r=>`<div class="tip good"><b>${esc(r.t)}</b><p>${esc(r.d)}</p><p class="from">Based on: ${esc(r.src)}</p></div>`).join("")}
  <h2>Eat less of this</h2>${R.less.map(r=>`<div class="tip bad"><b>${esc(r.t)}</b><p>${esc(r.d)}</p><p class="from">Based on: ${esc(r.src)}</p></div>`).join("")}`;
}

function viewAlerts(){
  const all=alerts(STATE.meals).sort((a,b)=>b.seq-a.seq);
  const reds=all.filter(a=>a.lvl==="red").length, ambers=all.filter(a=>a.lvl==="amber").length;
  if(!all.length) return `<div class="allclear">Nothing to flag. No organ meat, no alcohol, and no repeat of the double dried-seafood day.</div>`;
  const list = ALERTFILTER==="all"?all:all.filter(a=>a.lvl===ALERTFILTER);
  const seg = `<div class="seg">
    <button class="${ALERTFILTER==="all"?"on":""}" onclick="ALERTFILTER='all';route()">All ${all.length}</button>
    <button class="${ALERTFILTER==="red"?"on":""}" onclick="ALERTFILTER='red';route()">Red ${reds}</button>
    <button class="${ALERTFILTER==="amber"?"on":""}" onclick="ALERTFILTER='amber';route()">Orange ${ambers}</button>
  </div>`;
  const body = list.length ? list.map(a=>{
    const m=STATE.meals.find(x=>x.seq===a.seq);
    return `<div class="alert ${a.lvl}"><b>${esc(a.t)}</b>
      <p>${esc(a.d)}</p>
      ${m?`<button class="btn" onclick="openMeal('${m.id}')">Open ${esc(m.label)}</button>`:""}
      <p class="from">Based on: ${esc(a.src)}</p></div>`;
  }).join("") : `<div class="allclear">No ${ALERTFILTER==="red"?"red":"orange"} warnings.</div>`;
  return `<p class="sub">These warnings look at what kind of food you ate and how often — not exact amounts, because no meal here was weighed. Warnings that need a time window only work on meals with a date.</p>
  ${seg}${body}`;
}

function viewLibrary(){
  return `<p class="sub">${FOODS.length} foods. Every number says where it came from and how sure we are. <b>"No data" means nobody has measured it. The app never makes a number up.</b></p>
  <input class="search" placeholder="Search foods" oninput="filterLib(this.value)">
  <div id="lib">${libRows(FOODS)}</div>`;
}
function libRows(list){ return list.map(f=>`<div class="food"><div><span class="name">${esc(f.name)}</span> <span class="kind">${esc(f.cat)}</span></div>
  <div class="vals"><span>Purine ${val(f.purine.v," mg")} ${chip(f.purine.band,'purine')}</span><span>Blood sugar speed ${val(f.gi.v)} ${chip(f.gi.band,'gi')}</span><span>Sugar ${val(f.sugar.v," g")} ${chip(f.sugar.band,'sugar')}</span><span>Cholesterol ${val(f.chol.v," mg")}</span><span>Saturated fat ${val(f.satfat&&f.satfat.v," g")} ${f.satfat?chip(f.satfat.band,'satfat'):""}</span></div>
  ${(f.flags||[]).length?`<div class="tags">${f.flags.map(x=>`<i>${x.replace(/_/g," ")}</i>`).join("")}</div>`:''}
  <div class="from">${[f.purine,f.gi,f.sugar,f.chol,f.satfat||{}].filter(x=>x.src||x.note).map(x=>`<div>${x.src?esc(x.src):''}${x.note?` <em>${esc(x.note)}</em>`:''}${x.conf!=null?` — ${x.conf}% sure`:''}</div>`).join("")}</div></div>`).join(""); }
function filterLib(q){ q=q.toLowerCase(); $("#lib").innerHTML=libRows(FOODS.filter(f=>f.name.toLowerCase().includes(q)||f.cat.includes(q))); }

function viewSettings(){
  return viewAISettings()+`<h2>Your data</h2>
  <button class="btn" onclick="exportJSON()">Save a backup</button>
  <label class="btn">Load a backup<input type="file" accept="application/json" onchange="importJSON(this)" hidden></label>
  <button class="btn warn" onclick="if(confirm('Start over with just the original meals? Anything you added will be deleted.')){localStorage.removeItem(LS_KEY);location.reload();}">Start over</button>
  <h2>What this app cannot do</h2>
  <ul class="sub">
    <li>It cannot add up your daily purine in milligrams. Nobody weighed the food.</li>
    <li>Photo analysis and the dietitian review need your own API key (above). Without it, everything else works.</li>
    <li>It does not back itself up. Everything is stored in this browser only. Export your data now and then.</li>
    <li>It cannot diagnose anything. Your swollen toe was never confirmed as gout by a doctor.</li>
    <li>It has no cholesterol warning, because no health guideline sets a daily limit any more. It does warn about saturated fat, which does have a limit.</li>
  </ul>
  <h2>Where the numbers come from</h2><ul class="srclist">${Object.values(SRC).map(s=>`<li>${esc(s)}</li>`).join("")}<li>${esc(GUIDE.free_sugar_g.src)}</li><li>${esc(GUIDE.cholesterol_mg.src)}</li></ul>
  <p class="sub">App version ${VERSION}. The date is when this version was built.</p>`;
}

// ---------- ADD / EDIT MEAL ----------
let ADD = null;
function openAdd(m){
  PENDING_IMG=null;
  ADD = m ? JSON.parse(JSON.stringify(m)) : { id:"m"+Date.now(), seq:Math.max(0,...STATE.meals.map(x=>x.seq))+1, date:new Date().toISOString().slice(0,10), slot:"lunch", label:"", items:[], liquid:"none", checked:false, note:"" };
  renderModal();
}
function openMeal(id){ const m=STATE.meals.find(x=>x.id===id); if(m) openAdd(m); }
function renderModal(){
  const r=rateMeal(ADD);
  $("#modal").innerHTML=`<div class="sheet">
    <h2>${ADD.source?"Meal "+ADD.seq:"Add a meal"}</h2>
    <label>What did you eat?<input value="${esc(ADD.label)}" oninput="ADD.label=this.value"></label>
    <div class="grid2"><label>Date<input type="date" value="${ADD.date||''}" onchange="ADD.date=this.value||null"></label>
    <label>Slot<select onchange="ADD.slot=this.value">${["breakfast","brunch","lunch","snack","dinner"].map(s=>`<option ${ADD.slot===s?'selected':''}>${s}</option>`).join("")}</select></label></div>
    <label>Did you drink the soup or gravy?<select onchange="ADD.liquid=this.value;renderModal()">${[["none","No liquid — dry cooked"],["clear","Yes, a thin clear soup"],["concentrated","Yes, a thick boiled-down broth"],["gravy","Yes, a thick rempah or seafood gravy"]].map(([v,l])=>`<option value="${v}" ${ADD.liquid===v?'selected':''}>${l}</option>`).join("")}</select></label>
    <label class="checkline"><input type="checkbox" ${ADD.checked?'checked':''} onchange="ADD.checked=this.checked"> I asked what went into it</label>
    <label>Photo <span id="photoStatus"></span>
      <input type="file" accept="image/*" onchange="onPhoto(this)">
      <span class="hint">Tap to take a photo or pick one from your library.</span></label>
    ${ADD.photoError?`<div class="alert red"><b>Cannot read that photo</b><p>${esc(ADD.photoError)}</p></div>`:""}
    ${ADD.thumb?`<img class="thumb" src="data:image/jpeg;base64,${ADD.thumb}" alt="">`:""}
    <button id="aiBtn" class="btn primary" onclick="runMealAI()" ${AI.ready()?"":"disabled title='Add API key under More → AI'"}>${ADD.ai?"Ask again":"Ask the AI dietitian"}${PENDING_IMG?" about this photo":""}</button>
    ${renderAI(ADD.ai)}
    <label>Add the foods<input class="search" placeholder="Start typing a food" oninput="pickList(this.value)"></label>
    <div id="pick"></div>
    <div class="picked">${ADD.items.map(id=>`<span class="tag">${esc(FOOD[id]?.name||id)}<b onclick="ADD.items=ADD.items.filter(x=>x!=='${id}');renderModal()">×</b></span>`).join("")}</div>
    <label>Your own notes<textarea oninput="ADD.note=this.value">${esc(ADD.note||'')}</textarea></label>
    <div class="verdict"><b>Score for this meal:</b> ${chip(r.rating,'rating')}<ul>${r.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>${ADD.source?`<p class="sub">During our conversation this was scored <b>${BANDS.rating[ADD.rating].l}</b>. If you save, the new score replaces it.</p>`:''}</div>
    <div class="sheetbtns"><button class="btn primary" onclick="saveMeal()">Save</button><button class="btn" onclick="closeModal()">Cancel</button>${ADD.source?'':`<button class="btn warn" onclick="delMeal()">Delete</button>`}</div>
  </div>`;
  $("#modal").classList.add("open");
}
function pickList(q){ q=q.toLowerCase(); if(!q){$("#pick").innerHTML="";return;} const hits=FOODS.filter(f=>f.name.toLowerCase().includes(q)&&!ADD.items.includes(f.id)).slice(0,8);
  $("#pick").innerHTML=hits.map(f=>`<div class="hit" onclick="ADD.items.push('${f.id}');renderModal()">${esc(f.name)} <span class="cat">${esc(f.cat)}</span></div>`).join(""); }
function saveMeal(){ if(!ADD.label.trim()){alert("Please say what you ate first.");return;} const r=rateMeal(ADD); ADD.rating=r.rating; delete ADD.source;
  const i=STATE.meals.findIndex(x=>x.id===ADD.id); if(i>=0) STATE.meals[i]=ADD; else STATE.meals.push(ADD); save(); closeModal(); route(); }
function delMeal(){ if(!confirm("Delete this meal for good?")) return; STATE.meals=STATE.meals.filter(x=>x.id!==ADD.id); save(); closeModal(); route(); }
function closeModal(){ $("#modal").classList.remove("open"); $("#modal").innerHTML=""; }

// ---------- EXPORT / IMPORT ----------
function exportJSON(){ const b=new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`mealtrend-${new Date().toISOString().slice(0,10)}.json`; a.click(); }
function importJSON(inp){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const s=JSON.parse(rd.result); if(!s.meals) throw 0; STATE=s; save(); route(); alert("Loaded "+s.meals.length+" meals."); }catch(e){ alert("That file is not a MealTrend backup."); } }; rd.readAsText(f); }

// ---------- ROUTER ----------
const TABS=[["dash","Home"],["log","Meals"],["rank","Compare"],["lens","Advice"],["alerts","Warnings"],["lib","Foods"],["set","Settings"]];
let RANKKIND="purine";
let ALERTFILTER="all";
let MEALFILTER="all";
function goAlerts(f){ ALERTFILTER=f; location.hash="#alerts"; if((location.hash||"").slice(1)==="alerts") route(); }
function goMeals(f){ MEALFILTER=f; location.hash="#log"; if((location.hash||"").slice(1)==="log") route(); }
function route(){
  const h=(location.hash||"#dash").slice(1);
  if(h!=="log") MEALFILTER="all";
  if(h!=="alerts") ALERTFILTER="all";
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${h===k?'on':''}">${l}</a>`).join("");
  let body="";
  if(h==="dash") body=viewDashboard();
  else if(h==="log") body=viewLog();
  else if(h==="rank") body=`<div class="seg">${[["purine","Purine"],["gi","Blood sugar"],["satfat","Sat fat"],["sugar","Sugar"],["chol","Cholesterol"]].map(([k,l])=>`<button class="${RANKKIND===k?'on':''}" onclick="RANKKIND='${k}';route()">${l}</button>`).join("")}</div>`+viewRankings(RANKKIND);
  else if(h==="lens") body=viewLenses();
  else if(h==="alerts") body=viewAlerts();
  else if(h==="lib") body=viewLibrary();
  else body=viewSettings();
  $("#view").innerHTML=body;
  const badge=alerts(STATE.meals).filter(a=>a.lvl==="red").length;
  const b=$("#badge"); b.textContent=badge?badge:""; b.style.display=badge?"inline-flex":"none";
  b.title=badge?`${badge} red ${badge===1?"warning":"warnings"} — tap to read`:"";
}
window.addEventListener("hashchange",route);
window.addEventListener("load",()=>{ route(); if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{}); });

</script>
<script>
// ============================================================
// AI DIETITIAN LAYER — bring your own API key
// Key lives in localStorage on this device only. Never commit it.
// Every figure the model may cite comes from FOODS / GUIDE. "not available" is a valid answer.
// ============================================================

const AI = {
  key(){ return (STATE.settings||{}).apiKey || ""; },
  model(){ return (STATE.settings||{}).model || "claude-sonnet-5"; },
  ready(){ return !!this.key(); },

  // Compact library the model is allowed to cite from
  libraryText(){
    return FOODS.map(f=>{
      const p=f.purine.v==null?"n/a":f.purine.v+"mg"; const g=f.gi.v==null?(f.gi.band?f.gi.band+"(band)":"n/a"):f.gi.v;
      const s=f.sugar.v==null?"n/a":f.sugar.v+"g"; const c=f.chol.v==null?"n/a":f.chol.v+"mg";
      const sf=f.satfat&&f.satfat.v!=null?` | satfat ${f.satfat.v}g/100g(${f.satfat.band})`:"";
      const n=f.n||{}; const nz=Object.entries(n).filter(([k,x])=>x&&x.v!=null).map(([k,x])=>`${k} ${x.v}${x.range?`(${x.range[0]}-${x.range[1]})`:""}`).join(" ");
      return `${f.id} | ${f.name} | purine ${p} conf${f.purine.conf??"-"} | GI ${g} conf${f.gi.conf??"-"} | sugar/100g ${s} | chol/100g ${c}${sf}${nz?" | per100g: "+nz:""} | flags ${(f.flags||[]).join(",")||"-"}${f.purine.note?" | note: "+f.purine.note:""}${f.gi.note?" | gi-note: "+f.gi.note:""}${n.kcal?.note?" | kcal-note: "+n.kcal.note:""}`;
    }).join("\n");
  },

  system(){
    return `You are a registered dietitian with sub-specialty experience in rheumatology nutrition (gout / hyperuricaemia) and diabetes nutrition (glycaemic management), working with a Singapore-based adult male who had a single unconfirmed podagra episode after two dried-anchovy meals in one day. You are analysing his meals.

YOUR REMIT IS THE WHOLE PLATE, NOT ONLY PURINE. Analyse, in this order of prominence for THIS meal: energy, macronutrients (protein / fat / saturated fat / carbohydrate / fibre), sodium, added sugar, dietary cholesterol, glycaemic impact, and purine. Purine matters because of one unconfirmed podagra episode — it is not automatically the headline. A dessert's headline is sugar and energy. A hawker noodle's headline is usually sodium and saturated fat. Say which axis dominates THIS plate and why.

NON-NEGOTIABLE RULES
1. The FOOD LIBRARY below is your first source. If a figure is not in it, you MAY use the web_search tool to find published nutrient data — then you MUST give the source name and URL, and mark it "searched" not "library".
1b. When sources disagree, say so and give the RANGE, not a midpoint dressed up as a fact. Aggregator sites (SingaporeCalorie, SnapCalorie, MyFitnessPal, calorie blogs) are undisclosed-methodology estimates — label them as such and cap confidence at 50. Prefer, in order: government food composition tables (HPB Singapore, USDA FoodData Central, MEXT Japan), peer-reviewed studies, manufacturer panels, then aggregators.
1c. Never invent a figure. "not available" remains a correct and expected answer.
2. Cite the library id (e.g. [ikan_bilis]) or guideline id (e.g. [GUIDE:purine_window_days]) next to every figure or threshold you use.
3. Never compute a daily purine total in mg. No meal has a weighed portion.
4. Dietary cholesterol has NO guideline threshold (removed from US Dietary Guidelines 2015). Rank and note it; never alarm on it. Saturated fat and sodium DO have thresholds and matter more for heart risk — use them: [GUIDE:satfat] and [GUIDE:sodium]. If a dish contains coconut milk, pork lard, deep-fried batter or ghee, say so and give the saturated fat figure if you have one. Only 8 foods in the library carry a measured saturated fat value; web_search for the rest rather than guessing.
5. Do not diagnose. The podagra episode was never clinically confirmed. When relevant, say a serum urate test outranks any dietary inference.
6. Singapore hawker and home dishes vary by stall and kitchen. When an ingredient is conventional but unconfirmed (e.g. hae bee in laksa rempah, belacan in sambal, conpoy in a double-boiled soup), DO NOT assume it. State it as unconfirmed and put a specific question in "questions_to_ask". This user's answers to such questions have lowered the rating 4 times out of 4.
7. Purine rating logic, in order: highest purine band among items → confirmed dried seafood or organ meat forces at least High → a gravy conventionally containing dried seafood (unconfirmed) forces at least Moderate → concentrated liquid or gravy consumed forces at least Moderate → clear gently-simmered stock: rating follows the solids → dry-cooked with no dried seafood: cap at Low unless a High-band item is present.
8. Glycaemic reasoning: GI is per reference food; composite hawker dishes rarely have a tested value. Composition matters more than substitution — in one Singapore study plain white rice measured 96 and the same rice with oil, chicken and vegetables measured 50 [white_rice][rice_oil_chicken_veg]. Say so when the plate has protein/fat/vegetables alongside starch.
9. WRITE FOR A 15-YEAR-OLD. This is a hard requirement, not a style preference.
   - Short sentences. One idea each. Aim for 15 words or fewer.
   - Everyday words. Say "how fast it raises your blood sugar", not "glycaemic response". Say "fat that is bad for your heart", not "saturated fatty acid profile". Say "salt", not "sodium chloride" — though "sodium" itself is fine, it is on every label.
   - The first time you use a technical word in a note, explain it in the same sentence: "purine, a chemical your body turns into uric acid".
   - Say what to DO, in plain terms: "leave a third of the gravy in the bowl", not "moderate consumption of the liquid component".
   - No hedging phrases like "it may be prudent to consider". Say "do this" or "this is fine".
   - Never use these words without explaining them: glycaemic, postprandial, purine, urate, lipid, sodium load, extraction, bioavailability.
10. Return ONLY valid JSON matching the schema. No preamble, no markdown fences.

GUIDELINES (cite by id)
- GUIDE:purine_daily — ${GUIDE.purine_daily_mg.src}. Cannot be computed here.
- GUIDE:purine_window_days — ${GUIDE.purine_window_days.src}
- GUIDE:free_sugar — ${GUIDE.free_sugar_g.src}
- GUIDE:cholesterol — ${GUIDE.cholesterol_mg.src}
- GUIDE:alcohol — ${GUIDE.alcohol.src}
- GUIDE:acr2020 — FitzGerald JD et al. 2020 ACR gout guideline: dietary recommendations are conditional, low-to-very-low certainty; diet moves serum urate ~1.0–1.2 mg/dL.
- GUIDE:choi2004 — Choi HK et al. NEJM 2004: meat and seafood raised incident gout; dairy lowered it; purine-rich vegetables neutral.
- GUIDE:zhang2012_plant — Zhang Y et al. 2012: animal-source purine OR trend 2.41 vs plant 1.39 across quintiles.
- GUIDE:satfat — WHO and AHA: saturated fat under 10% of energy, about 22 g/day at 2000 kcal; AHA suggests under 6% (about 13 g) for people lowering LDL. UK FSA labels: 1.5 g or less per 100 g is low, over 5 g per 100 g is high. Coconut milk is 19 g/100 g and pork lard 39 g/100 g — these are the two big sources in this user's food. Saturated fat matters MORE for heart risk than cholesterol in food does.
- GUIDE:sodium — WHO: <2000 mg sodium/day (=5 g salt). Singapore HPB target 2000 mg/day; national average intake is roughly 3400 mg. Hawker food is the main contributor.
- GUIDE:satfat — WHO/AHA: saturated fat <10% of energy (AHA <6% for those needing LDL lowering) ≈ 22 g/day at 2000 kcal. Coconut milk, pork lard, fried batter and ghee are the sources in this log.
- GUIDE:fibre — WHO/HPB: ≥25 g/day. Whole fruit, vegetables, legumes, wholegrains.
- GUIDE:energy — no target set for this user; weight loss is an ACR 2020 conditional recommendation only for those overweight, and no anthropometrics were provided.

FOOD LIBRARY (id | name | purine mg/100g | GI | sugar | cholesterol | flags)
${this.libraryText()}`;
  },

  mealSchema: `{
 "identified_items": [{"name": string, "library_id": string|null, "confidence": 0-100}],
 "liquid_class": "none"|"clear"|"concentrated"|"gravy",
 "headline_axis": "energy"|"sodium"|"saturated fat"|"sugar"|"glycaemic"|"purine"|"cholesterol"|"balanced",
 "headline_why": string,
 "nutrients": [{"nutrient": string, "value": string, "basis": "library"|"searched"|"not available",
                "source": string, "url": string|null, "confidence": 0-100, "note": string}],
 "purine": {"rating": "vlow"|"low"|"moderate"|"high", "rationale": string, "cites": [string]},
 "glycaemic": {"band": "low"|"medium"|"high"|"not available", "rationale": string, "cites": [string]},
 "sugar": {"note": string, "cites": [string]},
 "lipids": {"note": string, "cites": [string]},
 "sodium_satfat": string,
 "questions_to_ask": [string],
 "what_to_change": [string],
 "what_is_fine": [string],
 "not_available": [string],
 "overall": string
}`,

  reviewSchema: `{
 "headline": string,
 "axis_ranking": [{"axis": string, "why_this_rank": string}],
 "patterns": [{"pattern": string, "evidence": string, "cites": [string]}],
 "top_risks": [{"risk": string, "why": string, "action": string, "cites": [string]}],
 "top_wins": [{"win": string, "why": string, "cites": [string]}],
 "swaps": [{"from": string, "to": string, "why": string}],
 "open_questions": [string],
 "test_recommendation": string,
 "limits": [string]
}`,

  // Extract the first complete JSON object by brace matching (string-aware).
  // Fence-stripping alone fails when the response is truncated or has trailing prose.
  extractJSON(text){
    const i=text.indexOf("{"); if(i<0) return null;
    let d=0, inStr=false, esc=false;
    for(let j=i;j<text.length;j++){
      const c=text[j];
      if(inStr){ if(esc) esc=false; else if(c==="\\") esc=true; else if(c==='"') inStr=false; continue; }
      if(c==='"'){ inStr=true; continue; }
      if(c==="{") d++;
      else if(c==="}"){ d--; if(d===0){ try{ return JSON.parse(text.slice(i,j+1)); }catch(e){ return null; } } }
    }
    return null; // unbalanced — response was cut off
  },

  async call(userContent, maxTokens, _retry){
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "content-type":"application/json", "x-api-key":this.key(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({
        model:this.model(), max_tokens:maxTokens||4000, system:this.system(),
        messages:[{role:"user", content:userContent}],
        tools: (STATE.settings||{}).noSearch ? undefined : [{ type:"web_search_20250305", name:"web_search", max_uses:5 }]
      })
    });
    if(!res.ok){ const t=await res.text(); throw new Error(`API ${res.status}: ${t.slice(0,300)}`); }
    const data=await res.json();
    // With web_search enabled the response contains server_tool_use and web_search_tool_result
    // blocks interleaved with text. Take text blocks only, in order.
    const blocks=data.content||[];
    const text=blocks.filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const searches=blocks.filter(b=>b.type==="server_tool_use"&&b.name==="web_search").map(b=>b.input?.query).filter(Boolean);
    const truncated = data.stop_reason==="max_tokens";
    const json=this.extractJSON(text);
    if(json) return { json, raw:text, usage:data.usage, truncated:false, searches };
    if(truncated && !_retry){
      // Retry once, asking for terse output. Truncation is the usual cause of a parse failure.
      const terse=[...userContent];
      terse.push({type:"text", text:"IMPORTANT: your previous reply was cut off before the JSON closed. Reply again with the SAME schema but keep every string under 25 words and every array to at most 3 entries. Output the JSON object only — no fences, no commentary."});
      return this.call(terse, (maxTokens||4000)+2000, true);
    }
    return { json:null, raw:text, usage:data.usage, truncated, parseError:true, searches };
  },

  async analyseMeal(meal, imageB64, mediaType){
    const A=analyse(STATE.meals);
    const context = `LOG CONTEXT: ${A.n} meals so far. Dry-cooked meals without dried seafood rated Low or below ${A.dryNoSeaLow}/${A.dryNoSea}. Liquid meals rated Moderate+ ${A.liquidElevated}/${A.liquid}. Dried seafood in ${A.driedSea} meals. Alcohol ${A.alcohol}, organ meat ${A.organ}. The user checked ingredients ${A.checked} times; every answer lowered the rating.

MEAL TO ANALYSE
label: ${meal.label||"(none)"}
slot: ${meal.slot} · date: ${meal.date||"not recorded"}
items selected by user: ${meal.items.map(id=>FOOD[id]?.name||id).join(", ")||"(none — identify from photo)"}
liquid consumed (user-declared): ${meal.liquid}
ingredient checked with cook/stall: ${meal.checked?"yes":"no"}
user note: ${meal.note||"-"}

If any identified food is NOT in the library, use web_search to find its published nutrient data (energy, protein, fat, saturated fat, carbohydrate, fibre, sodium, sugar, cholesterol per 100 g or per piece) before answering. Fill "nutrients" with what you find, marking basis "searched" and giving source + url. Give ranges where sources disagree.\n\nReturn the JSON object only — no markdown fences, no text before or after.\nKeep every string under 35 words and arrays to at most 6 entries for "nutrients", 4 for the rest.\nSchema:\n${this.mealSchema}`;
    const content=[];
    if(imageB64) content.push({type:"image", source:{type:"base64", media_type:mediaType||"image/jpeg", data:imageB64}});
    content.push({type:"text", text:context});
    return this.call(content, 4000);
  },

  async reviewLog(){
    const A=analyse(STATE.meals);
    const meals=[...STATE.meals].sort((a,b)=>a.seq-b.seq).map(m=>`#${m.seq} ${m.date||"undated"} ${m.slot} | ${m.label} | items: ${m.items.join(",")} | liquid: ${m.liquid} | checked: ${m.checked?"y":"n"} | rating: ${m.rating}${m.ai?.purine?.rating?` | ai: ${m.ai.purine.rating}`:""}${m.note?` | note: ${m.note}`:""}`).join("\n");
    const stats=`STATS: n=${A.n}; ratings ${JSON.stringify(A.byRating)}; dry ${A.dry} (no-dried-seafood ${A.dryNoSea}, of which Low ${A.dryNoSeaLow}); liquid ${A.liquid} (elevated ${A.liquidElevated}); gravy ${A.gravy}; clear ${A.clear}; dried seafood ${A.driedSea}; sweetened ${A.sweet}; high-GI ${A.highGI}; starch ${A.starch}; dairy ${A.dairy}; egg ${A.egg}; plant protein ${A.plant}; alcohol ${A.alcohol}; organ ${A.organ}; checked ${A.checked}.`;
    const text=`Write a dietitian's review of this meal log covering ALL nutrition axes, not only purine. Judge which axes actually matter given what is here — for a hawker-heavy log that is usually sodium and saturated fat before purine. Be specific to what is in the log. Do not invent meals or figures. You may web_search for nutrient data on named dishes not in the library; cite source and url.

${stats}

MEAL LOG
${meals}

Return the JSON object only — no markdown fences, no text before or after.\nKeep every string under 40 words and every array to at most 5 entries.\nSchema:\n${this.reviewSchema}`;
    return this.call([{type:"text", text}], 5000);
  }
};

// ---------- image helpers ----------
function fileToResized(file, maxPx, quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1, maxPx/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      let dataUrl;
      try{ dataUrl=c.toDataURL("image/jpeg",quality); }
      catch(e){ reject(new Error("Could not read this image (canvas blocked).")); return; }
      resolve(dataUrl.split(",")[1]);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url);
      reject(new Error(`Could not decode ${file.name||"this file"} (${file.type||"unknown type"}). If it is a HEIC photo, open it in Photos, tap Share \u2192 Duplicate, or set Settings \u2192 Camera \u2192 Formats \u2192 Most Compatible, then pick it again.`)); };
    img.src=url;
  });
}

// ---------- UI hooks ----------
let PENDING_IMG=null; // full-res base64 for the API call; not persisted
async function onPhoto(inp){
  const f=inp.files[0]; if(!f) return;
  const st=$("#photoStatus"); if(st) st.textContent="Reading the photo…";
  try{
    PENDING_IMG = await fileToResized(f, 1280, 0.82);
    ADD.thumb   = await fileToResized(f, 420, 0.6);
    ADD.photoError=null;
  }catch(e){
    PENDING_IMG=null; ADD.thumb=null; ADD.photoError=String(e.message||e);
  }
  renderModal();
}
async function runMealAI(){
  if(!AI.ready()){ alert("Add your API key in Settings first. It stays on this phone."); return; }
  if(!PENDING_IMG && !ADD.items.length && !ADD.label.trim()){ alert("Add a photo, pick some foods, or type what you ate first."); return; }
  const btn=$("#aiBtn"); btn.disabled=true; btn.textContent="Thinking…";
  try{
    const r=await AI.analyseMeal(ADD, PENDING_IMG, "image/jpeg");
    if(r.parseError){ ADD.ai={error: r.truncated ? "The AI ran out of room to finish its answer, twice. Try again, or pick fewer foods." : "The AI replied in the wrong format. Try again.", raw:r.raw}; }
    else { ADD.ai=r.json; ADD.ai.model=AI.model(); ADD.ai.at=new Date().toISOString(); ADD.ai.usage=r.usage; ADD.ai.searches=r.searches;
      // adopt identified items the user hasn't already added, when they map to the library
      (ADD.ai.identified_items||[]).forEach(it=>{ if(it.library_id && FOOD[it.library_id] && !ADD.items.includes(it.library_id) && it.confidence>=60) ADD.items.push(it.library_id); });
      if(ADD.ai.liquid_class && ADD.liquid==="none" && ADD.ai.liquid_class!=="none") ADD.liquid=ADD.ai.liquid_class;
      if(!ADD.label && ADD.ai.identified_items?.length) ADD.label=ADD.ai.identified_items.slice(0,3).map(i=>i.name).join(", ");
    }
  }catch(e){ ADD.ai={error:String(e.message||e)}; }
  renderModal();
}
async function runLogAI(){
  if(!AI.ready()){ alert("Add your API key under More → AI."); return; }
  const box=$("#reviewBox"); box.innerHTML=`<p class="sub">Reading all ${STATE.meals.length} meals…</p>`;
  try{ const r=await AI.reviewLog(); if(r.parseError) throw new Error("Model returned non-JSON: "+r.raw.slice(0,200));
    STATE.review={...r.json, model:AI.model(), at:new Date().toISOString(), usage:r.usage}; save(); box.innerHTML=renderReview(STATE.review);
  }catch(e){ box.innerHTML=`<p class="alert red">${esc(e.message)}</p>`; }
}
function renderAI(ai){
  if(!ai) return "";
  if(ai.error) return `<div class="ai failed"><b>The AI could not finish</b><p>${esc(ai.error)}</p>${ai.raw?`<pre>${esc(ai.raw.slice(0,600))}</pre>`:""}</div>`;
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const cites=c=>(c||[]).length?`<span class="cites">${(c||[]).map(esc).join(" ")}</span>`:"";
  return `<div class="ai">
    <div class="who"><b>AI dietitian note</b><span class="mono">${esc(ai.model||"")}</span></div>
    <p class="summary">${esc(ai.overall||"")}</p>
    ${ai.identified_items?.length?`<div class="part"><b>Identified</b> ${ai.identified_items.map(i=>`<span class="tag">${esc(i.name)}${i.library_id?"":" <em>(not in library)</em>"} <span class="mono">${i.confidence}%</span></span>`).join("")}</div>`:""}
    ${ai.headline_axis?`<div class="part main"><b>The main thing here</b> <span class="status s-moderate">${esc(ai.headline_axis)}</span> ${esc(ai.headline_why||"")}</div>`:""}
    ${ai.nutrients?.length?`<div class="part"><b>What is in it</b><table class="ntab"><tr><th>Nutrient</th><th>Amount</th><th>Where from</th><th>Sure?</th></tr>${ai.nutrients.map(n=>`<tr class="${n.basis==="not available"?"none":""}"><td>${esc(n.nutrient)}</td><td class="mono">${esc(n.value)}</td><td>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.basis)}</a>`:esc(n.basis)}${n.source?`<span class="where">${esc(n.source)}</span>`:""}</td><td class="mono">${n.confidence!=null?n.confidence+"%":"—"}</td></tr>${n.note?`<tr class="rownote"><td colspan="4">${esc(n.note)}</td></tr>`:""}`).join("")}</table></div>`:""}
    <div class="part"><b>Purine</b> ${chip(ai.purine?.rating,'rating')} <span>${esc(ai.purine?.rationale||"")}</span> ${cites(ai.purine?.cites)}</div>
    <div class="part"><b>Blood sugar</b> ${ai.glycaemic?.band&&ai.glycaemic.band!=="not available"?chip(ai.glycaemic.band==="medium"?"med":ai.glycaemic.band,'gi'):'<span class="nodata">No data</span>'} <span>${esc(ai.glycaemic?.rationale||"")}</span> ${cites(ai.glycaemic?.cites)}</div>
    ${ai.sugar?.note?`<div class="part"><b>Sugar</b> ${esc(ai.sugar.note)} ${cites(ai.sugar.cites)}</div>`:""}
    ${ai.lipids?.note?`<div class="part"><b>Fats</b> ${esc(ai.lipids.note)} ${cites(ai.lipids.cites)}</div>`:""}
    ${ai.sodium_satfat?`<div class="part"><b>Salt and heart fat</b> ${esc(ai.sodium_satfat)}</div>`:""}
    ${ai.questions_to_ask?.length?`<div class="part ask"><b>Ask before you assume</b><ul>${li(ai.questions_to_ask)}</ul></div>`:""}
    ${ai.what_to_change?.length?`<div class="part"><b>Change this</b><ul>${li(ai.what_to_change)}</ul></div>`:""}
    ${ai.what_is_fine?.length?`<div class="part"><b>This part is fine</b><ul>${li(ai.what_is_fine)}</ul></div>`:""}
    ${ai.not_available?.length?`<div class="part"><b>No data for these</b><ul>${li(ai.not_available)}</ul></div>`:""}
    ${ai.searches?.length?`<div class="part"><b>Looked up online</b> ${ai.searches.map(q=>`<span class="tag">${esc(q)}</span>`).join("")}</div>`:""}
    <p class="disc">Numbers marked "library" are fixed and come from published research. Numbers marked "searched" were looked up just now — click the link and check them. Calorie-counting websites are guesses, not lab tests. This is written by an AI, not a real dietitian, and it cannot diagnose you.</p>
  </div>`;
}
function renderReview(r){
  if(!r) return "";
  const cites=c=>(c||[]).length?`<span class="cites">${(c||[]).map(esc).join(" ")}</span>`:"";
  return `<div class="ai">
    <div class="who"><b>Review of all your meals</b><span class="mono">${esc(r.model||"")} · ${(r.at||"").slice(0,10)}</span></div>
    <p class="summary">${esc(r.headline||"")}</p>
    <h3>Patterns I can see</h3>${(r.patterns||[]).map(p=>`<div class="tip"><b>${esc(p.pattern)}</b><p>${esc(p.evidence)}</p>${cites(p.cites)}</div>`).join("")}
    <h3>Biggest things to fix</h3>${(r.top_risks||[]).map(p=>`<div class="tip bad"><b>${esc(p.risk)}</b><p>${esc(p.why)}</p><p><b>Do this:</b> ${esc(p.action)}</p>${cites(p.cites)}</div>`).join("")}
    <h3>Things you are doing well</h3>${(r.top_wins||[]).map(p=>`<div class="tip good"><b>${esc(p.win)}</b><p>${esc(p.why)}</p>${cites(p.cites)}</div>`).join("")}
    ${r.swaps?.length?`<h3>Easy swaps</h3>${r.swaps.map(s=>`<div class="tip"><b>${esc(s.from)} → ${esc(s.to)}</b><p>${esc(s.why)}</p></div>`).join("")}`:""}
    ${r.open_questions?.length?`<h3>Things worth finding out</h3><ul class="sub">${r.open_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}
    ${r.test_recommendation?`<div class="tip"><b>Get this checked</b><p>${esc(r.test_recommendation)}</p></div>`:""}
    ${r.limits?.length?`<h3>What this review cannot tell you</h3><ul class="sub">${r.limits.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}
    <p class="disc">Written by an AI using the food list and health guidelines in this app. It is not a real dietitian and it cannot diagnose you.</p>
  </div>`;
}
function saveAISettings(){ STATE.settings=STATE.settings||{}; STATE.settings.apiKey=$("#apiKey").value.trim(); STATE.settings.model=$("#aiModel").value.trim()||"claude-sonnet-5"; save(); alert("Saved on this phone."); }
function viewAISettings(){
  const s=STATE.settings||{};
  return `<h2>AI dietitian</h2>
  <p class="sub">You need your own Anthropic API key for the photo analysis and the meal review. The key is saved in this browser only. It is never uploaded anywhere except to Anthropic when you ask a question. Anyone who picks up this phone and opens the browser tools can read it, so do not do this on a shared computer.</p>
  <label>API key<input id="apiKey" type="password" value="${esc(s.apiKey||"")}" placeholder="sk-ant-…"></label>
  <label>Which AI model<input id="aiModel" value="${esc(s.model||"claude-sonnet-5")}"></label>
  <button class="btn primary" onclick="saveAISettings()">Save</button>
  <p class="sub">Each photo you analyse costs a few cents. The AI is told to use only the numbers in this app, to look things up online when a food is missing, and to say "no data" rather than guess. It still gets things wrong sometimes. Treat what it writes as a helpful first draft you check, not as medical advice.</p>`;
}
